<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Post Run Drip — beta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400..800;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =============================================================
   Post Run Drip — beta prototype  ·  v2
   "Restraint as foundation, intensity as accent."
   Tokens from design-system/colors_and_type.css
   ============================================================= */
:root{
  --paper:#F5F3F0; --paper-elevated:#FAFAF8; --card:#FFFFFF; --paper-deep:#E8E4DF; --rule:#E8E4E0;
  --ink:#1A1815; --ink-2:#6B6560; --ink-3:#9B9590;
  --coral:#D4592A; --coral-light:#E8764A; --coral-deep:#B84420; --coral-wash:rgba(212,89,42,0.12);
  --mood-energized:#2D8A4E; --mood-positive:#4A9E6B; --mood-neutral:#9B9590;
  --mood-tired:#C4873A; --mood-struggling:#C45A3A; --mood-injured:#B83A4A; --success:#2D8A4E;
  --pace-easy:#93B9D6; --pace-moderate:#74A8CC; --pace-steady:#578FC0; --pace-mp:#3F7CB5;
  --pace-hmp:#2F66A8; --pace-lt:#27549B; --pace-10k:#20448B; --pace-5k:#1A3679;
  --pace-3k:#142964; --pace-mile:#0E1D4E; --pace-easy-text:#5E93BE;
  --fd:"Crimson Pro",Georgia,"Times New Roman",serif;
  --fb:"PT Serif",Georgia,"Times New Roman",serif;
  --fm:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{ background:#2A2622; color:var(--ink); font-family:var(--fb); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; display:flex; align-items:center; justify-content:center; min-height:100vh; }
.phone{ position:relative; width:100%; max-width:404px; height:100vh; max-height:880px; background:var(--paper); overflow:hidden; display:flex; flex-direction:column; border-radius:34px; box-shadow:0 24px 60px rgba(0,0,0,0.45); }
@media (max-width:440px){ .phone{ max-height:none; height:100vh; border-radius:0; } body{background:var(--paper);} }
.statusbar{ flex:0 0 auto; height:38px; display:flex; align-items:center; justify-content:space-between; padding:0 22px; font-family:var(--fm); font-size:12px; font-weight:600; color:var(--ink); }
.statusbar .dots{ color:var(--ink-2); font-size:11px; }
.screen{ flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; }

/* type primitives */
.eyebrow{ font-family:var(--fm); font-size:11px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-2); }
.eyebrow.coral{ color:var(--coral); }
.h-display{ font-family:var(--fd); font-weight:700; color:var(--ink); letter-spacing:-0.01em; line-height:1.05; margin:0; }
.body{ font-family:var(--fb); font-size:15px; line-height:1.55; color:var(--ink); }
.body-sm{ font-family:var(--fb); font-size:13px; line-height:1.5; color:var(--ink-2); }
.quote{ font-family:var(--fb); font-style:italic; line-height:1.55; color:var(--ink); }
.caption{ font-family:var(--fm); font-size:10px; letter-spacing:0.10em; color:var(--ink-2); text-transform:uppercase; }
.mono{ font-family:var(--fm); font-variant-numeric:tabular-nums; }
.e-rule{ display:flex; align-items:center; gap:8px; }
.e-rule::before,.e-rule::after{ content:""; flex:1; height:1px; background:var(--rule); }
.e-rule .dot{ width:3px; height:3px; border-radius:999px; background:var(--rule); }
.hairline{ height:1px; background:var(--rule); width:100%; }
.plate-strip{ display:flex; justify-content:space-between; align-items:flex-start; font-family:var(--fm); font-size:10px; letter-spacing:0.14em; color:var(--ink-2); text-transform:uppercase; padding:12px 22px 0 22px; }
.plate-strip .l b{ color:var(--ink); font-weight:600; display:block; }
.plate-strip .r{ text-align:right; cursor:pointer; }
.plate-strip .r b{ color:var(--ink); font-weight:600; display:block; }
.plate-strip .r:hover b{ color:var(--coral); }
.body-scroll{ flex:1; overflow-y:auto; padding:14px 22px 28px 22px; scroll-behavior:smooth; -ms-overflow-style:none; scrollbar-width:none; }
.body-scroll::-webkit-scrollbar{ display:none; }
.section{ margin-top:22px; }
.section.first{ margin-top:6px; }
.section-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
.card{ background:var(--card); border-radius:12px; padding:16px; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
.card.pad-lg{ padding:20px; }
.btn{ font-family:var(--fd); font-weight:600; font-size:16px; padding:14px 18px; border-radius:10px; border:0; cursor:pointer; transition:background .15s, transform .15s; }
.btn:active{ transform:scale(0.98); }
.btn-primary{ background:var(--coral); color:#fff; width:100%; }
.btn-primary:hover{ background:var(--coral-deep); }
.btn-ink{ background:var(--ink); color:#fff; width:100%; display:flex; align-items:center; justify-content:center; gap:8px; font-family:-apple-system,"SF Pro Text",system-ui,sans-serif; font-weight:600; font-size:15px; }
.link{ font-family:var(--fd); font-weight:600; font-size:14px; color:var(--coral); text-decoration:none; border-bottom:1px solid var(--coral); padding-bottom:1px; cursor:pointer; }
.link:hover{ color:var(--coral-deep); border-color:var(--coral-deep); }
.link-mono{ font-family:var(--fm); font-size:10px; font-weight:500; letter-spacing:0.10em; text-transform:uppercase; color:var(--ink-2); cursor:pointer; }
.link-mono:hover{ color:var(--coral); }
.link-mono.coral{ color:var(--coral); }
.mood-pill{ display:inline-flex; padding:3px 8px; border-radius:999px; font-family:var(--fm); font-size:10px; font-weight:600; letter-spacing:0.10em; text-transform:uppercase; }

/* tab bar — 5 tabs */
.tab-bar{ flex:0 0 auto; background:var(--paper); border-top:1px solid var(--rule); padding:9px 0 max(11px,env(safe-area-inset-bottom)) 0; display:grid; grid-template-columns:repeat(5,1fr); }
.tab{ display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; user-select:none; }
.tab .tdot{ width:6px; height:6px; border-radius:999px; background:transparent; border:1.5px solid var(--ink-3); box-sizing:border-box; transition:all .15s; }
.tab.active .tdot{ background:var(--coral); border-color:var(--coral); }
.tab .tlbl{ font-family:var(--fm); font-size:9px; letter-spacing:0.07em; color:var(--ink-2); text-transform:uppercase; }
.tab.active .tlbl{ color:var(--ink); font-weight:600; }

/* login */
.signin{ flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:30px; padding:24px 30px; text-align:center; }
.logo-tile{ width:132px; height:132px; background:var(--ink); border-radius:28px; display:flex; align-items:center; justify-content:center; }
.logo-word{ font-family:-apple-system,"SF Pro Display",system-ui,"Helvetica Neue",Arial,sans-serif; font-weight:800; font-size:26px; line-height:0.98; color:#fff; text-align:left; letter-spacing:-0.01em; position:relative; }
.logo-word .drip{ position:absolute; right:-2px; bottom:-11px; width:7px; height:11px; background:var(--coral); border-radius:0 0 999px 999px; }
.logo-word .drip::before{ content:""; position:absolute; top:-4px; left:1px; width:5px; height:5px; background:var(--coral); border-radius:999px; }
.signin-title{ font-family:var(--fd); font-weight:700; font-size:27px; color:var(--ink); }
.signin-sub{ font-family:var(--fb); font-style:italic; font-size:15px; color:var(--ink-2); margin-top:-18px; }
.signin-form{ width:100%; display:flex; flex-direction:column; gap:11px; }
.field{ background:var(--card); border-radius:10px; padding:14px; font-family:var(--fb); font-size:15px; color:var(--ink); border:1px solid var(--rule); width:100%; }
.field::placeholder{ color:var(--ink-3); font-style:italic; }
.field:focus{ outline:2px solid var(--coral); outline-offset:0; border-color:transparent; }
.signin-foot{ font-family:var(--fm); font-size:10px; letter-spacing:0.10em; text-transform:uppercase; color:var(--ink-3); }

/* LOG */
.mode-toggle{ display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); margin:10px -22px 0 -22px; }
.mode-btn{ padding:13px 0 0 0; text-align:center; cursor:pointer; background:transparent; border:0; font-family:var(--fm); font-size:11px; font-weight:500; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-2); }
.mode-btn.active{ color:var(--coral); }
.mode-rail{ height:2px; background:transparent; margin-top:10px; }
.mode-btn.active .mode-rail{ background:var(--coral); }
.log-hero{ text-align:center; padding:30px 6px 22px 6px; }
.log-hero h1{ font-size:38px; }
.log-hero p{ font-family:var(--fb); font-style:italic; font-size:15px; color:var(--ink-2); margin:13px 0 0 0; line-height:1.4; }
.record{ position:relative; width:120px; height:120px; display:grid; place-items:center; cursor:pointer; margin:6px auto 0 auto; }
.record .ring{ position:absolute; inset:0; border-radius:999px; border:1.5px solid rgba(212,89,42,0.20); opacity:0; }
.record.rec .ring{ opacity:1; animation:rec-pulse 1800ms ease-in-out infinite; }
@keyframes rec-pulse{ 0%,100%{transform:scale(1);opacity:.5;} 50%{transform:scale(1.14);opacity:.12;} }
.record .disc{ width:88px; height:88px; border-radius:999px; background:var(--coral); box-shadow:0 4px 12px rgba(212,89,42,0.30); display:grid; place-items:center; transition:transform .25s, background .15s; }
.record:active .disc{ transform:scale(0.98); background:var(--coral-deep); }
.record.rec .disc{ transform:scale(1.03); }
.record .inner{ width:32px; height:32px; border-radius:999px; background:#fff; transition:all .25s; }
.record.rec .inner{ width:24px; height:24px; border-radius:5px; }
.record-cap{ text-align:center; font-family:var(--fm); font-size:11px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-2); margin-top:16px; }
.hl-block{ border-top:1px solid var(--rule); padding:14px 22px; margin:0 -22px; }
.hl-block .row{ display:flex; justify-content:space-between; align-items:baseline; }
.notes-area{ width:100%; margin-top:10px; min-height:70px; background:transparent; border:0; outline:none; resize:none; font-family:var(--fb); font-size:15px; line-height:1.5; color:var(--ink); padding:0; }
.notes-area::placeholder{ color:var(--ink-3); font-style:italic; }
.jrow{ display:grid; grid-template-columns:3px 1fr; gap:14px; padding:20px 22px; border-bottom:1px solid var(--rule); margin:0 -22px; cursor:pointer; }
.jrow:hover{ background:rgba(0,0,0,0.012); }
.jrail{ border-radius:2px; margin:3px 0; }
.jhead{ display:flex; align-items:baseline; gap:12px; }
.jday{ font-family:var(--fd); font-weight:700; font-size:20px; color:var(--ink); letter-spacing:-0.01em; flex:1; }
.jind{ display:inline-flex; align-items:center; gap:5px; font-family:var(--fm); font-size:10px; font-weight:500; letter-spacing:0.08em; }
.jmeta{ font-family:var(--fm); font-size:10px; font-weight:500; letter-spacing:0.08em; color:var(--ink-2); margin-top:5px; text-transform:uppercase; }
.jbody{ font-family:var(--fb); font-style:italic; font-size:14px; line-height:1.55; color:var(--ink); margin-top:12px; }
.jfoot{ display:flex; align-items:center; gap:8px; margin-top:12px; flex-wrap:wrap; }
.niggle-chip{ display:inline-flex; align-items:center; gap:5px; font-family:var(--fm); font-size:10px; font-weight:500; letter-spacing:0.06em; text-transform:uppercase; color:var(--coral); border:1px solid var(--coral-wash); background:var(--coral-wash); padding:2px 8px; border-radius:999px; }

/* seg control */
.seg{ display:flex; gap:2px; padding:3px; background:var(--paper-deep); border-radius:9px; }
.seg button{ flex:1; border:0; background:transparent; color:var(--ink-3); padding:7px 4px; border-radius:6px; cursor:pointer; font-family:var(--fm); font-size:10.5px; font-weight:500; letter-spacing:0.06em; text-transform:uppercase; }
.seg button.on{ background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,0.06); font-weight:600; }

/* breadcrumb */
.breadcrumb{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:12px; }
.crumb{ font-family:var(--fm); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-3); cursor:pointer; }
.crumb.here{ color:var(--coral); }
.crumb.sep{ color:var(--ink-3); cursor:default; }

/* quality/easy legend + tags */
.qe-legend{ display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; }
.qe-legend span{ display:inline-flex; align-items:center; gap:5px; font-family:var(--fm); font-size:9px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-2); }
.qe-sw{ width:9px; height:9px; border-radius:2px; }
.qe-tag{ display:inline-flex; align-items:center; gap:5px; font-family:var(--fm); font-size:9.5px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; }

/* block week rows */
.blkrow{ display:grid; grid-template-columns:64px 1fr 44px; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--rule); cursor:pointer; }
.blkrow:last-child{ border-bottom:0; }
.blkrow:hover{ background:rgba(0,0,0,0.012); }
.blk-wk{ font-family:var(--fm); font-size:11px; font-weight:600; color:var(--ink); }
.blk-wk small{ display:block; font-size:9px; color:var(--ink-3); font-weight:500; letter-spacing:0.06em; margin-top:2px; }
.minibar{ display:flex; height:22px; border-radius:3px; overflow:hidden; background:var(--paper-deep); }
.minibar .seg-b{ height:100%; }
.blk-mi{ font-family:var(--fm); font-size:14px; font-weight:600; color:var(--ink); text-align:right; font-variant-numeric:tabular-nums; }
.blk-mi small{ display:block; font-size:8.5px; color:var(--ink-3); font-weight:500; }
.blkrow.now .blk-wk{ color:var(--coral); }

/* month calendar */
.pager{ display:flex; align-items:center; justify-content:space-between; }
.pager button{ background:transparent; border:0; font-family:var(--fm); font-size:15px; color:var(--ink-2); cursor:pointer; padding:2px 8px; }
.pager button:hover{ color:var(--coral); }
.pager .mlabel{ font-family:var(--fd); font-weight:700; font-size:18px; }
.cal{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-top:10px; }
.cal .cdow{ font-family:var(--fm); font-size:9px; letter-spacing:0.04em; text-transform:uppercase; color:var(--ink-3); text-align:center; padding-bottom:4px; }
.cal .cell{ aspect-ratio:1/1.2; border-radius:6px; background:var(--paper-elevated); padding:4px 3px 3px 3px; display:flex; flex-direction:column; align-items:center; cursor:pointer; }
.cal .cell.empty{ background:transparent; cursor:default; }
.cal .cell.today{ outline:1.5px solid var(--coral); }
.cal .cell.plan{ background:transparent; border:1px dashed var(--rule); }
.cal .cnum{ font-family:var(--fm); font-size:10px; color:var(--ink-2); font-variant-numeric:tabular-nums; }
.cal .cell.today .cnum{ color:var(--coral); font-weight:600; }
.cal .cdot{ width:8px; height:8px; border-radius:2px; margin-top:auto; }
.cal .cmi{ font-family:var(--fm); font-size:8px; color:var(--ink-2); margin-top:2px; font-variant-numeric:tabular-nums; }

/* week day rows */
.wkrow{ display:grid; grid-template-columns:52px 1fr auto; gap:10px; align-items:center; padding:12px 0; border-bottom:1px solid var(--rule); cursor:pointer; }
.wkrow:last-child{ border-bottom:0; }
.wkrow:hover{ background:rgba(0,0,0,0.012); }
.wkrow.plan{ opacity:0.6; }
.wk-dow{ font-family:var(--fm); font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-2); }
.wk-dow small{ display:block; color:var(--ink-3); font-size:9px; margin-top:2px; }
.wk-wo{ font-family:var(--fd); font-size:16px; font-weight:700; color:var(--ink); }
.wk-mi{ font-family:var(--fm); font-size:13px; font-weight:600; color:var(--ink); text-align:right; font-variant-numeric:tabular-nums; }

/* ratio bar */
.ratio-num{ font-family:var(--fm); font-weight:600; font-size:30px; color:var(--ink); font-variant-numeric:tabular-nums; }
.ratio-num small{ font-size:13px; color:var(--ink-3); }
.ratiobar{ display:flex; height:14px; border-radius:4px; overflow:hidden; margin-top:10px; background:var(--paper-deep); }
.ratiobar .easy{ background:var(--pace-easy); }
.ratiobar .hard{ background:var(--pace-lt); position:relative; }
.ratiobar .hard::after{ content:""; position:absolute; inset:0; background-image:repeating-linear-gradient(45deg,transparent 0 3px,rgba(245,243,240,0.5) 3px 4px); }
.ratio-key{ display:flex; justify-content:space-between; margin-top:6px; }

/* day detail */
.day-hero{ display:flex; justify-content:space-between; align-items:flex-start; }
.zone-line{ display:grid; grid-template-columns:52px 1fr 58px; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--rule); }
.zone-line:last-child{ border-bottom:0; }
.zone-name{ font-family:var(--fd); font-size:14px; font-weight:600; }
.zone-track{ height:10px; border-radius:3px; background:var(--paper-deep); overflow:hidden; }
.zone-fill{ height:100%; }
.zone-mi{ font-family:var(--fm); font-size:12px; font-weight:600; text-align:right; font-variant-numeric:tabular-nums; color:var(--ink); }
.link-card{ display:flex; justify-content:space-between; align-items:center; padding:13px 16px; background:var(--paper-elevated); border-radius:10px; margin-top:8px; cursor:pointer; }
.link-card:hover{ background:#fff; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
.link-card .lc-t{ font-family:var(--fd); font-size:14px; font-weight:600; color:var(--ink); }
.link-card .lc-s{ font-family:var(--fb); font-style:italic; font-size:12.5px; color:var(--ink-2); margin-top:2px; }
.link-card .lc-a{ font-family:var(--fm); font-size:11px; color:var(--coral); }

/* chart (Trends) */
.tiles3{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.tile{ background:var(--paper-elevated); border-radius:10px; padding:12px 13px; }
.tile .lab{ font-family:var(--fm); font-size:9px; letter-spacing:0.10em; text-transform:uppercase; color:var(--ink-3); }
.tile .val{ font-family:var(--fm); font-weight:600; font-size:22px; color:var(--ink); margin-top:5px; font-variant-numeric:tabular-nums; }
.tile .val small{ font-size:11px; color:var(--ink-3); font-weight:500; }
.tile .sub{ font-family:var(--fm); font-size:9px; letter-spacing:0.05em; text-transform:uppercase; color:var(--ink-2); margin-top:4px; }
.tile .sub.pos{ color:var(--mood-energized); } .tile .sub.neg{ color:var(--coral); }
.chartwrap{ position:relative; margin-top:6px; }
.chart{ width:100%; height:auto; display:block; overflow:visible; }
.readout{ position:absolute; pointer-events:none; opacity:0; transition:opacity .12s; background:var(--ink); color:#F5F3F0; border-radius:9px; padding:9px 11px; font-family:var(--fm); font-size:11px; min-width:118px; box-shadow:0 8px 24px rgba(0,0,0,0.22); z-index:3; }
.readout b{ color:#fff; } .readout .r{ display:flex; justify-content:space-between; gap:14px; margin-top:3px; color:#C9C2BA; }
.readout .r b{ color:#fff; font-weight:600; } .readout .tot{ border-top:1px solid rgba(255,255,255,0.18); margin-top:6px; padding-top:5px; }
.pkey{ margin-top:16px; }
.pkey .bar{ height:9px; border-radius:5px; background:linear-gradient(90deg,#93B9D6,#74A8CC,#578FC0,#3F7CB5,#2F66A8,#27549B,#20448B,#1A3679,#142964,#0E1D4E); }
.pkey .anchors{ position:relative; height:32px; margin-top:3px; }
.pkey .anchor{ position:absolute; top:0; display:flex; flex-direction:column; align-items:center; transform:translateX(-50%); }
.pkey .anchor .tick{ width:1px; height:6px; background:var(--ink-3); opacity:.5; }
.pkey .anchor .zn{ font-family:var(--fd); font-weight:700; font-size:11px; line-height:1.1; margin-top:3px; }
.pkey .anchor .pc{ font-family:var(--fm); font-size:8.5px; color:var(--ink-2); margin-top:1px; font-variant-numeric:tabular-nums; }
.read-inline{ margin-top:16px; border-top:1px solid var(--rule); padding-top:14px; }
.read-inline .body{ font-family:var(--fb); font-size:14.5px; line-height:1.6; color:var(--ink); margin-top:7px; }
.read-inline .body b{ color:var(--coral-deep); font-weight:700; }
.read-inline .q{ font-family:var(--fd); font-style:italic; font-size:14.5px; color:var(--ink-2); margin-top:9px; }
.moodarc{ display:flex; align-items:flex-end; gap:5px; height:44px; margin-top:4px; }
.moodarc .mb{ flex:1; border-radius:2px 2px 0 0; min-height:5px; }
.moodarc-x{ display:flex; justify-content:space-between; margin-top:6px; }
.niggle{ padding:14px 0; border-bottom:1px solid var(--rule); }
.niggle:last-child{ border-bottom:0; }
.niggle-head{ display:flex; justify-content:space-between; align-items:baseline; }

<script>
/* ============================================================

const ZONES=[["Easy","#93B9D6"],["Moderate","#74A8CC"],["Steady","#578FC0"],["MP","#3F7CB5"],["HMP","#2F66A8"],["LT","#27549B"],["10K","#20448B"],["5K","#1A3679"],["3K","#142964"],["Mile","#0E1D4E"]];

const ATHLETE={ name:"Maya", block:"Marathon block.", weeks:12, goalLabel:"Boston qualifier", goalTime:"3:16", pb:"3:28", anchor:{name:"Half", md:"Apr 6", time:"1:37:40"}, raceName:"Marathon", raceDate:new Date(2026,8,20), fitness:{mid:"3:26", range:"3:22–3:29", conf:"Moderate"} };

  {off:0,  type:"Easy", label:"Easy 4 mi",  dist:4,  z:{Easy:4},           mood:"neutral",  kind:"text",  note:"Shakeout before the weekend. Legs a little flat, but that's a Friday. Kept it honest and easy."},
  {off:1,  type:"MP",   label:"MP 8 mi",    dist:8,  z:{Easy:2,MP:6},      mood:"positive", kind:"voice", dur:"2:41", note:"Marathon-pace eight. Locked into 7:5x from the second mile and it held. This is the one I wanted this week."},
  {off:2,  type:"Easy", label:"Easy 5 mi",  dist:5,  z:{Easy:5},           mood:"neutral",  kind:"text",  note:"Easy between the two quality days. Nothing to report, which is the point."},
  {off:3,  type:"LT",   label:"LT 6 mi",    dist:6,  z:{Easy:2,LT:4},      mood:"positive", kind:"voice", dur:"3:02", note:"Hit the splits within a few seconds either way. Smooth through four, then the wind on the back half. Calf was quiet today — I noticed that.", niggle:{part:"calf",quote:"calf was quiet today"}},

/* ---- Generate the full block: day-by-day history (single source of truth) ---- */
function roleOfType(t){ if(t==="Rest")return"rest"; if(t==="Long")return"long"; if(t==="Easy"||EASY_Z.includes(t))return"easy"; return"quality"; }
function buildDays(){
  const days=[];
  const thisMon=new Date(TODAY); thisMon.setDate(TODAY.getDate()-((TODAY.getDay()+6)%7));
  const QROT=["LT","5K","MP","HMP","LT","3K","MP","10K","LT","5K","HMP","MP"]; // Tue quality by block week 1..12
  const base={1:0,2:6,3:5,4:8,5:4,6:0,0:16}; const baseSum=39;
  for(let w=0; w<12; w++){
    const monday=new Date(thisMon); monday.setDate(thisMon.getDate()-w*7);
    const blockWeek=12-w; const target=WK_TARGET[blockWeek-1]; const scale=target/baseSum; const qType=QROT[blockWeek-1];
    const phase = blockWeek<=4?"Base":(blockWeek<=8?"Build":(blockWeek<=11?"Peak":"Taper"));
    for(let i=0;i<7;i++){
      const date=new Date(monday); date.setDate(monday.getDate()+i);
      const off=offOf(date); if(off<0) continue;
      const dow=date.getDay(); const b=base[dow]; let role,type,dist,z={};
      if(b===0){ role="rest"; type="Rest"; dist=0; }
      else if(dow===0){ role="long"; type="Long"; dist=round(b*scale); const e=round(dist*0.75); z={Easy:e,Steady:dist-e}; }
      else if(dow===2){ role="quality"; type=qType; dist=round(b*scale); const wu=(["5K","3K","10K"].includes(qType))?3:2; z={Easy:wu}; z[qType]=Math.max(2,dist-wu); }
      else if(dow===4){ role="quality"; type="MP"; dist=round(b*scale); z={Easy:2,MP:Math.max(2,dist-2)}; }
      else { role="easy"; type="Easy"; dist=round(b*scale); z={Easy:dist}; }
      days.push({off,date,dow,blockWeek,phase,role,type,dist,z,label:role==="rest"?"Rest":(type+" "+dist+" mi"),now:off===0});
    }
  }
  SESSIONS.forEach(s=>{ const d=days.find(x=>x.off===s.off); if(d){ d.type=s.type; d.label=s.label; d.dist=s.dist; d.z=s.z; d.role=s.rest?"rest":roleOfType(s.type); d.mood=s.mood; d.note=s.note; d.kind=s.kind; d.dur=s.dur; d.niggle=s.niggle; } });
  days.sort((a,b)=>a.off-b.off);
  return days;
}
function buildWeeks(days){
  const map={}; days.forEach(d=>{ (map[d.blockWeek]=map[d.blockWeek]||[]).push(d); });
  return Object.keys(map).map(Number).sort((a,b)=>a-b).map(num=>{
    const ds=map[num]; const byZone={}; let vol=0,qualMi=0;
    ds.forEach(d=>{ for(const z in d.z){ byZone[z]=(byZone[z]||0)+d.z[z]; vol+=d.z[z]; if(!EASY_Z.includes(z)) qualMi+=d.z[z]; } });

}
function buildMonths(days){
  const map={}; days.forEach(d=>{ const k=d.date.getFullYear()+"-"+d.date.getMonth(); if(!map[k]) map[k]={m:d.date.getMonth(),y:d.date.getFullYear(),z:{},vol:0}; for(const z in d.z){ map[k].z[z]=(map[k].z[z]||0)+d.z[z]; map[k].vol+=d.z[z]; } });
  return Object.values(map).sort((a,b)=>(a.y-b.y)||(a.m-b.m));
}
const _DAYS=buildDays(), _WEEKS=buildWeeks(_DAYS), _MONTHS=buildMonths(_DAYS);
const dayByOff=off=>_DAYS.find(d=>d.off===off);

/* ---- key sessions (the workouts that matter: quality + long) ---- */
const isKey=d=>!!d && d.dist>0 && (d.role==="quality"||d.role==="long");
function keySessions(){ return _DAYS.filter(isKey).sort((a,b)=>a.off-b.off); } // recent first

const WEEK_SIGNAL={
 1:{mood:"positive",nig:0,quote:"Legs springy — good week back."},

const PACE_PROG={ MP:[487,485,483,481,479,480,477,475,474,473,472,472], LT:[440,438,436,434,431,433,430,428,427,426,425,428], "5K":[410,408,406,404,401,403,400,398,396,395,394,394] };

/* ---- 30-day pace distribution (miles per zone) ---- */
function paceSpectrum(){ const z={}; _DAYS.filter(d=>d.off<30).forEach(d=>{ for(const k in d.z) z[k]=(z[k]||0)+d.z[k]; }); return ZONES.map(([zn,c])=>({zone:zn,color:c,mi:round(z[zn]||0)})); }

/* ---- workout detail: stats + splits ---- */
function paceSec(p){ const a=p.split(":").map(Number); return a[0]*60+a[1]; }
const ZPACE=Object.fromEntries(PACES.map(p=>[p.zone,paceSec(p.pace)]));
const IF_ZONE={Easy:0.68,Moderate:0.74,Steady:0.80,MP:0.90,HMP:0.94,LT:1.0,"10K":1.05,"5K":1.10,"3K":1.14,Mile:1.18};
const HR_ZONE={Easy:138,Moderate:143,Steady:147,MP:154,HMP:159,LT:164,"10K":168,"5K":172,"3K":175,Mile:178};
function fmtClock(sec){ sec=Math.round(sec); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return (h?h+":"+String(m).padStart(2,"0"):String(m))+":"+String(s).padStart(2,"0"); }
function fmtPaceSec(sec){ const m=Math.floor(sec/60), s=Math.round(sec%60); return m+":"+String(s).padStart(2,"0"); }
function workoutStats(d){ let pw=0,load=0,hw=0; for(const z in d.z){ pw+=ZPACE[z]*d.z[z]; load+=(IF_ZONE[z]||0.7)*d.z[z]; hw+=(HR_ZONE[z]||140)*d.z[z]; }
  const avg=pw/d.dist; return { dist:d.dist, avg, dur:avg*d.dist, gap:avg-7, load:Math.round(load*10), hr:Math.round(hw/d.dist), cad:176+(d.role==="quality"?3:0), drift:d.role==="quality"?"+3.1%":"+1.7%" }; }
function splitsFor(d){ const present=ZONES.map(([z])=>z).filter(z=>d.z[z]); const fast=present[present.length-1];
  const label=z=>{ if(z==="Easy") return d.role==="quality"?"Warm-up + cool-down":(d.role==="long"?"Easy miles":"Easy"); if(z==="Steady") return d.role==="long"?"Steady close":"Steady"; return z+(d.role==="quality"?" work":""); };
  return ZONES.filter(([z])=>d.z[z]).map(([z,c])=>({seg:label(z),dist:d.z[z],pace:ZPACE[z],zone:z,color:c,fast:z===fast&&d.role==="quality"})); }

function sessionsWithNotes(){ return SESSIONS.filter(s=>!s.rest && s.note); }

function renderCrumb(){
  const L=STATE.trLevel;

  if(L==="month"){ parts.push(`<span class="crumb sep">›</span><span class="crumb here">${MO3[STATE.trMonth.getMonth()]}</span>`); }

  return `<div class="breadcrumb">${parts.join("")}</div>`;
}
function stackBar(byZone){
  const tot=sum(byZone)||1;
  return ZONES.filter(([z])=>byZone[z]).map(([z,c])=>`<div class="seg-b" style="width:${byZone[z]/tot*100}%;background:${c}"></div>`).join("");
}
function renderBlock(){
  const total=_WEEKS.reduce((a,w)=>a+w.vol,0);
  const qual=_WEEKS.reduce((a,w)=>a+w.qualMi,0);
  const ep=round((total-qual)/total*100);

  return `

      </div>`).join("")}</div>`;
}
function renderMonth(){
  const y=STATE.trMonth.getFullYear(), m=STATE.trMonth.getMonth();
  const first=new Date(y,m,1).getDay(), dim=new Date(y,m+1,0).getDate();
  let monthMi=0,q=0,e=0;
  let cells=""; ["S","M","T","W","T","F","S"].forEach(d=>cells+=`<div class="cdow">${d}</div>`);
  for(let i=0;i<first;i++) cells+=`<div class="cell empty"></div>`;
  for(let dd=1;dd<=dim;dd++){
    const dt=new Date(y,m,dd), off=offOf(dt), d=dayByOff(off);
    const isToday=off===0;
    if(d){ monthMi+=d.dist; for(const z in d.z){ if(EASY_Z.includes(z)) e+=d.z[z]; else q+=d.z[z]; }
      const col=roleColor(d), op=d.role==="rest"?0.3:1;
      cells+=`<div class="cell ${isToday?"today":""}" onclick="trOpenDay(${off})">${isKey(d)?`<span class="kstar-cal">★</span>`:""}<span class="cnum">${dd}</span><span class="cdot" style="background:${col};opacity:${op}"></span><span class="cmi">${d.dist?d.dist:""}</span></div>`;
    } else {
      const dow=dt.getDay(), p=PLAN_TEMPLATE[dow], future=off<0;
      cells+=`<div class="cell ${future?"plan":"empty"}"><span class="cnum" style="color:var(--ink-3)">${dd}</span>${future&&p.mi?`<span class="cdot" style="background:var(--ink-3);opacity:0.28"></span><span class="cmi" style="color:var(--ink-3)">${p.mi}</span>`:""}</div>`;
    }
  }
  const ep=monthMi?round(e/monthMi*100):0;
  return `
    <div class="section"><div class="card" style="padding:14px 16px;">
      <div class="pager"><button onclick="trMonthShift(-1)">‹</button><span class="mlabel">${MO3[m]} ${y}</span><button onclick="trMonthShift(1)">›</button></div>

}
function renderWeek(){

  return `

        <div class="wk-mi">${d.dist?d.dist+" mi":"—"}</div></div>`;

      <div class="niggle-quote">“${nn.latest.quote}” <span class="caption" style="color:var(--ink-3)">· ${WD3[d.getDay()]} ${fmtMd(d)}</span></div>
      <div class="niggle-time">${dots.join("")}<span class="lab">${nn.count} mention${nn.count>1?"s":""} · 14d</span></div></div>`; }).join("")+`<div class="liability">Not medical advice. If anything gets sharper, see a clinician.</div>`; }
function sparkCard(data){ const w=290,h=54,min=Math.min(...data),max=Math.max(...data); const xs=data.map((_,i)=>(i/(data.length-1))*w); const ys=data.map(v=>h-((v-min)/((max-min)||1))*(h-10)-5); const path=xs.map((x,i)=>`${i===0?"M":"L"} ${x.toFixed(1)} ${ys[i].toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block;margin:10px 0 2px;"><path d="${path}" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${xs[xs.length-1].toFixed(1)}" cy="${ys[ys.length-1].toFixed(1)}" r="3.5" fill="var(--coral)"/></svg>
  <div style="display:flex;justify-content:space-between;"><span class="caption" style="color:var(--ink-3)">12 WK AGO</span><span class="caption" style="color:var(--coral)">NOW · FITTER</span></div>`; }
function paceRow(p){ return `<div class="pace-row"><span class="pace-swatch" style="background:${ZCOLOR[p.zone]}"></span><span><span class="pace-label">${p.zone}</span> <span class="pace-hint">${p.hint}</span></span><span class="pace-val">${p.pace}<small>/mi${p.range?" · "+p.range:""}</small></span></div>`; }

/* ============================================================ READ */
const READS={
  today:{ label:"This week", headline:"The legs came back.", prose:`You logged Sunday's long run tired and still found the last four miles — that's the block doing its work, not breaking you. Since then the easy days have actually been easy, and the marathon-pace eight on Thursday locked in from the second mile. Mileage sits right in the taper now: down on purpose, freshness climbing. Nothing in the last two weeks says push.`, q:`Does the quiet in the legs read as fresh, or as flat? Only you can feel the difference.` },
  cycle:{ label:"Since last cycle", headline:"Fitter than the last build.", prose:`Set against your winter block, the aerobic base is deeper — you're holding more easy volume at the same effort, and quality is landing at paces that were race-only three months ago. Your 10K-equivalent has dropped about <b>16 seconds a mile</b> since April. The shape of this build is stronger than the one that produced your ${ATHLETE.pb}.`, q:`If the fitness is ahead of last cycle, is ${ATHLETE.goalTime} still the right target — or a conservative one?` },
  niggle:{ label:"The niggle", headline:"The calf went quiet.", prose:`The calf turned up three times over two weeks — <b>“tight after the long run,”</b> then <b>“still there on the warm-up,”</b> then simply <b>“quiet today.”</b> Read in order, that's a niggle settling, not building. The knee got a single mention on an easy day and hasn't come back. None of this is a diagnosis — it's your own words, tracked.`, q:`Is the calf actually quiet, or just quiet on the easy days?`, liability:true },
  mileage:{ label:"Mileage", headline:"Right where the ramp wants it.", prose:`Twelve weeks of building took you to a <b>56-mile</b> peak before this taper. The easy-to-quality split has held near <b>80/20</b> the whole way — the ratio that keeps a build climbing without tipping into risk. This week is intentionally light; the work is already in the bank.`, q:`Taper weeks test patience more than fitness — how's the patience holding?` } };
function renderRead(){
  if(isEmpty()) return `<div class="section first"><span class="eyebrow coral">The read</span><h1 class="h-display read-headline">Nothing to read yet.</h1></div>
    ${emptyState("The read needs a few runs first.","Once you've logged a week or so, this becomes a short, honest paragraph on how your training is actually going, written fresh each day.")}
    <div style="margin-top:16px;"><span class="link" onclick="go('log')">Start logging ↗</span></div>`;
  const r=READS[STATE.lens], d=dayFromOffset(0);
  return `<div class="section first"><div class="eyebrow">${WD[d.getDay()].toUpperCase()} · ${fmtMd(d).toUpperCase()}</div>
    <h1 class="h-display read-headline">${r.headline}</h1>
    <div class="lenses">${Object.keys(READS).map(k=>`<span class="lens ${k===STATE.lens?"on":""}" onclick="setLens('${k}')">${READS[k].label}</span>`).join("")}</div>
    <div class="read-prose">${r.prose}</div><div class="read-q">${r.q}</div>
    ${r.liability?`<div class="liability">Not medical advice. If anything gets sharper, see a clinician.</div>`:""}
    <div class="read-sig">— restraint as foundation, intensity as accent</div><div style="height:8px;"></div></div>`;
}
function setLens(k){ STATE.lens=k; rerenderScroll(); }

/* ============================================================ PLAN */
function typeColor(t){ const key=(t||"").split(" ")[0]; const map={Easy:"--pace-easy",Long:"--pace-steady",Steady:"--pace-steady",Moderate:"--pace-moderate",MP:"--pace-mp",HMP:"--pace-hmp",LT:"--pace-lt","10K":"--pace-10k","5K":"--pace-5k","3K":"--pace-3k",Mile:"--pace-mile"}; return map[key]?`var(${map[key]})`:null; }
function planForDate(dt){ const off=offOf(dt); if(off>=0){ const d=dayByOff(off); if(!d) return null; return {wo:d.role==="rest"?"Rest":d.label,type:d.type,rest:d.role==="rest",done:true,mi:d.dist||0}; } const p=PLAN_TEMPLATE[dt.getDay()]; return {wo:p.wo,type:p.wo.split(" ")[0],rest:p.wo==="Rest",done:false,mi:p.mi}; }
function renderPlan(){
  if(isEmpty()) return `<div class="section first"><span class="eyebrow coral">Goal</span><h1 class="h-display" style="font-size:30px;margin-top:6px;">Set a race, and a shape appears.</h1></div>
    ${emptyState("No goal race yet.","Add the race you're pointing at and this fills with a calendar, weekly targets, and the paces to hit them.")}
    <div style="margin-top:16px;"><span class="link">Set a goal race ↗</span></div>`;
  const race=ATHLETE.raceDate, daysOut=round((race-TODAY)/DAYMS);
  const monday=new Date(TODAY); monday.setDate(TODAY.getDate()-((TODAY.getDay()+6)%7)); let week="";
  for(let i=0;i<7;i++){ const dt=new Date(monday); dt.setDate(monday.getDate()+i); const p=planForDate(dt); const done=p&&p.done&&!p.rest;
    week+=`<div class="plan-row"><div><div class="plan-day">${WD3[dt.getDay()].toUpperCase()} · ${fmtMd(dt)}</div><div class="plan-wo">${p?p.wo:"Rest"}</div></div>
      <div style="text-align:right;">${p&&!p.rest?`<span class="plan-mi">${p.mi} mi</span>`:`<span class="caption">rest</span>`}<div class="caption" style="color:${done?"var(--mood-energized)":"var(--ink-3)"};margin-top:2px;">${p&&!p.rest?(done?"✓ done":"planned"):""}</div></div></div>`; }
  return `<div class="section first"><div class="card goal-card pad-lg">
      <div><div class="eyebrow coral">Goal · ${ATHLETE.goalLabel}</div><div class="h-display" style="font-size:22px;margin-top:6px;">${ATHLETE.raceName} · ${MO3[race.getMonth()]} ${race.getDate()}</div><div class="caption" style="margin-top:6px;">${daysOut} days out · PB ${ATHLETE.pb}</div></div>
      <div style="text-align:right;"><div class="goal-time">${ATHLETE.goalTime}</div><div class="caption" style="text-align:right;">target</div></div></div></div>
    <div class="section"><div class="section-head"><span class="eyebrow">This week</span><span class="link-mono" onclick="STATE.tab='training';STATE.trLevel='week';STATE.trWeek=${curBlockWeek};render();">Open in calendar ↗</span></div>
      <div class="card" style="padding:4px 16px;">${week}</div></div>
    <div class="section"><div class="body-sm" style="font-style:italic;">Planned sessions layer onto the Training calendar — tap any day there to compare planned vs. actual.</div></div>
    <div style="height:12px;"></div>`;
}

/* ============================================================ tabs + menu + boot */
function afterTab(){
  if(STATE.tab==="trends" && !isEmpty()){
    const tab=$("#tvtab"); if(tab&&!tab.dataset.bound){ tab.dataset.bound="1"; tab.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; STATE.trTab=b.dataset.t; updateTrends(); }); }
    const lc=$("#layerchips"); if(lc&&!lc.dataset.bound){ lc.dataset.bound="1"; lc.addEventListener("click",e=>{ const c=e.target.closest(".layer-chip"); if(!c) return; STATE.layers[c.dataset.layer]=!STATE.layers[c.dataset.layer]; updateTrends(); }); }
    updateTrends();
  }
  if(STATE.tab==="training" && !isEmpty()){ const seg=$("#trseg"); if(seg&&!seg.dataset.bound){ seg.dataset.bound="1"; seg.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; trSet(b.dataset.l); }); } }
}
function bindTab(){ document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{ STATE.tab=t.dataset.tab; render(); const sc=$("#scroll"); if(sc) sc.scrollTop=0; })); afterTab(); }
function openMenu(){ renderMenu(); $("#scrim").classList.add("open"); $("#sheet").classList.add("open"); }
function closeMenu(){ $("#scrim").classList.remove("open"); $("#sheet").classList.remove("open"); }
function renderMenu(){ const opts=[["sample","Sample runner","Maya — 12 weeks of runs, moods, niggles, a goal race."],["empty","New runner","Day one. Clean empty states, before any data."]];
  $("#menu-opts").innerHTML=opts.map(([id,t,d])=>`<div class="opt ${STATE.dataset===id?"sel":""}" onclick="setDataset('${id}')"><div><div class="ot">${t}</div><div class="od">${d}</div></div><div class="check"></div></div>`).join(""); }
function setDataset(id){ STATE.dataset=id; STATE.trLevel="week"; STATE.trWeek=curBlockWeek; renderMenu(); render(); closeMenu(); }
function tickClock(){ const el=$("#clock"); if(!el) return; const d=new Date(); el.textContent=(d.getHours()%12||12)+":"+String(d.getMinutes()).padStart(2,"0"); }
render(); tickClock(); setInterval(tickClock,15000);
</script>
</body>
