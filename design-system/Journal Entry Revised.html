<!doctype html>
<!-- @dsCard group="Screens" name="Journal Entry Revised" subtitle="Light polish of the production entry: dateline, 3-stat strip, clearer in-app run link" -->
<html>
<head>
  <meta charset="utf-8">
  <title>Post Run Drip · Journal Entry · Revised</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="ui_kits/ios_app/tokens.css">
  <style>
    html, body { margin: 0; padding: 0; min-height: 100vh; background: #1A1815; }
    #root { width: 100%; min-height: 100vh; }
    .ref-board { width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; }
    .ref-board img { max-width: 100%; max-height: 100%; display: block; }
    .ref-tag {
      position: absolute; top: 12px; left: 12px;
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 10px; letter-spacing: 0.14em;
      background: rgba(212, 89, 42, 0.95); color: #fff;
      padding: 4px 8px; border-radius: 2px; text-transform: uppercase; z-index: 2;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- kit -->
  <script type="text/babel" src="ui_kits/ios_app/ios-frame.jsx"></script>
  <script type="text/babel" src="ui_kits/ios_app/Primitives.jsx"></script>
  <script type="text/babel" src="ui_kits/ios_app/design-canvas.jsx"></script>

  <!-- screen -->
  <script type="text/babel" src="journal-polish.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    function JRFrame({ children }) {
      return (
        <IOSDevice width={390} height={844}>
          <div style={{
            paddingTop: 62, paddingBottom: 34, height: "100%", boxSizing: "border-box",
            display: "flex", flexDirection: "column", background: "var(--paper)",
          }}>
            <div style={{ flex: 1, overflow: "hidden" }}>{children}</div>
            <TabBar active="log" onChange={() => {}} />
          </div>
        </IOSDevice>
      );
    }

    function CurrentScreenshot({ src, label }) {
      return (
        <div style={{ position: "relative", width: "100%", height: "100%" }}>
          <span className="ref-tag">{label}</span>
          <div className="ref-board"><img src={src} alt="Current journal entry screen" /></div>
        </div>
      );
    }

    function Canvas() {
      return (
        <DesignCanvas
          title="Journal Entry · Light Polish"
          subtitle="Same layout — just un-flattened: a dateline, a 3-stat strip, a clearer in-app run link."
        >
          <DCSection id="compare" title="Before → after">
            <DCArtboard id="current" label="Current · production (flat)" width={390} height={844}>
              <CurrentScreenshot src="uploads/IMG_3938-fef3ad23.PNG" label="Current" />
            </DCArtboard>
            <DCArtboard id="revised" label="Revised · same bones, more life" width={390} height={844}>
              <JRFrame><JournalRevised /></JRFrame>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Canvas />);
  </script>
</body>
</html>
