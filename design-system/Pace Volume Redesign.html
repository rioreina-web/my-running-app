<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pace × Volume — Redesign</title>
<link rel="stylesheet" href="colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: #EDEAE5; }
  * { box-sizing: border-box; }
</style>
<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" fill="#F5F3F0"/>
    <path d="M18 70 Q34 30 46 56 T72 40" fill="none" stroke="#4A9E6B" stroke-width="3"/>
    <circle cx="60" cy="52" r="4" fill="#D4592A"/>
  </svg>
</template>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="pv-data.jsx"></script>
<script type="text/babel" src="pv-shell.jsx"></script>
<script type="text/babel" src="pv-spectrum.jsx"></script>
<script type="text/babel" src="pv-ledger.jsx"></script>
<script type="text/babel" src="pv-strip.jsx"></script>
<script type="text/babel" src="pv-columns.jsx"></script>
<script type="text/babel" src="pv-ring.jsx"></script>
<script type="text/babel" src="pv-switcher.jsx"></script>

<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard, PVStudio, PV_STYLES } = window;
  const card = { borderRadius: 26, background: "var(--paper)", overflow: "hidden" };

  const LOCK_H = { spectrum: 560, ledger: 726, strip: 548, weekly: 568, ring: 624 };
  const LOCK_LABEL = {
    spectrum: "A · Spectrum — density curve",
    ledger:   "B · Zone Ledger — data-first table",
    strip:    "C · Mile Strip — every run a dot",
    weekly:   "D · Weekly Build — 9 weeks over time",
    ring:     "E · Zone Ring — the block as a wheel",
  };

  function Studio() {
    return (
      <DesignCanvas>
        <DCSection id="pacevol-switch" title="Pace × Volume — switchable"
          subtitle="One phone, five graph styles · tap CURVE / LEDGER / DOTS / BUILD / RING to swap the chart · ALL/WORKOUTS and drag-to-read stay live">
          <DCArtboard id="switchable" label="Switchable graph styles" width={402} height={772} style={card}>
            <PVStudio initial="spectrum" />
          </DCArtboard>
        </DCSection>

        <DCSection id="pacevol-all" title="All five directions, side by side"
          subtitle="The same 9-week block in every style — for comparing at a glance">
          {PV_STYLES.map((s) => (
            <DCArtboard key={s.id} id={"lock-" + s.id} label={LOCK_LABEL[s.id]}
              width={402} height={LOCK_H[s.id]} style={card}>
              <PVStudio lock={s.id} />
            </DCArtboard>
          ))}
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<Studio />);
</script>
</body>
</html>
