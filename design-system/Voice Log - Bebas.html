<!doctype html>
<!-- @dsCard group="Screens" name="Voice Log · Bebas hero" subtitle="Bebas Neue hero, stripped back" viewport="1330x1010" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Post Run Drip · Voice Log · Bebas hero</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=Bebas+Neue&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFFFFF;--ink:#111111;--ink-2:#6B6B6B;--ink-3:#9A9A9A;--rule:#EBEBEB;--red:#EE2B24;--red-text:#D31F19;--sans:"Helvetica Neue",Helvetica,"Archivo",system-ui,sans-serif;--serif:"Times New Roman",Times,serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--display:"Bebas Neue","Archivo",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#C6C6C6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.sheet{padding:30px 28px 40px}
.row{display:flex;gap:34px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:12px;flex:none;width:393px}
.cap{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#4A4A4A;line-height:1.4}
.cap b{color:#111}
.phone{width:393px;height:852px;flex:none;background:var(--paper);color:var(--ink);font-family:var(--sans);border-radius:46px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 22px 60px rgba(0,0,0,.28),0 0 0 10px #0C0C0C,0 0 0 11px #2C2C2C}
a{color:var(--ink)}a:hover{color:var(--red-text)}
button{font-family:var(--sans)}

.sb{height:54px;flex:none;padding:0 30px 0 34px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:700}
.sb .g{display:flex;align-items:center;gap:6px}
.sb .bars{display:flex;align-items:flex-end;gap:2px;height:11px}
.sb .bars i{width:3px;background:var(--ink);border-radius:1px;display:block}
.sb .bars i:nth-child(1){height:4px}.sb .bars i:nth-child(2){height:6px}.sb .bars i:nth-child(3){height:9px}.sb .bars i:nth-child(4){height:11px}
.sb .batt{display:flex;align-items:center;justify-content:center;min-width:29px;height:16px;background:var(--ink);color:#fff;border-radius:4px;font-size:10px;font-weight:700;padding:0 4px}
.mast{flex:none;padding:10px 22px 18px;border-bottom:1px solid var(--rule);display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.mast .mark{height:58px;width:auto;display:block;flex:none}
.mast .r{display:flex;flex-direction:column;align-items:flex-end;gap:10px;padding-top:2px}
.mast .rtop{display:flex;align-items:center;gap:2px}
.icon{width:44px;height:44px;margin-right:-10px;background:transparent;border:0;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:0 10px;cursor:pointer}
.icon i{display:block;height:2px;border-radius:2px;background:var(--ink)}
.link{height:44px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;text-decoration:none}

.body{flex:1;min-height:0;display:flex;flex-direction:column;padding:26px 22px 0;overflow:hidden}
.kicker{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:2px solid var(--ink);padding-top:8px}
.kicker span{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.kicker span:first-child{color:var(--ink)}
.eyebrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.eyebrow span{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.eyebrow a{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink-2);padding-bottom:2px;white-space:nowrap}

/* hero headline — Bebas Neue */
.h{font-family:var(--display);font-weight:700;text-transform:uppercase;margin:0;color:var(--ink)}
.dek{font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.4;color:var(--ink-2);margin:11px 0 0}
.orn{display:block;width:34px;height:2px;background:var(--red)}

.lede{border-bottom:1px solid var(--rule)}
.linked{padding:16px 0 18px;border-bottom:1px solid var(--rule)}
.lrun{font-family:var(--mono);font-size:13px;line-height:1.5;color:var(--ink-2);margin:9px 0 0;font-variant-numeric:tabular-nums}
.lrun b{font-weight:500;color:var(--ink)}
.lrun i{font-style:normal;font-size:11px}

/* v1 · centred */
.v1 .lede{padding:6px 0 26px;text-align:center}
.v1 .h{font-size:62px;line-height:.86;letter-spacing:.005em}
.v1 .orn{margin:20px auto 0}

/* v2 · left, stacked, figure hanging */
.v2 .lede{padding:20px 0 22px}
.v2 .h{font-size:74px;line-height:.82;letter-spacing:.004em}
.v2 .h span{display:block}
.v2 .h .red{color:var(--red)}
.v2 .dek{margin-top:16px;max-width:26ch}
.v2 .linked{border-top:0}

/* v3 · headline with mono rail + inline pull figure */
.v3 .lede{padding:20px 0 22px;display:grid;grid-template-columns:1fr auto;align-items:end;gap:14px}
.v3 .h{font-size:66px;line-height:.84;letter-spacing:.004em}
.v3 .rail{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;padding-bottom:4px}
.v3 .dek{grid-column:1/-1;margin-top:4px}
.v3 .pull{display:flex;align-items:flex-end;gap:8px;margin-top:12px}
.v3 .pull b{font-family:var(--display);font-size:38px;line-height:.8;letter-spacing:.01em;font-weight:700}
.v3 .pull span{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);padding-bottom:4px}

/* record */
.hero{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px 0 30px}
.hero .big{width:132px;height:132px;flex:none;border-radius:999px;background:var(--red);border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:transform 150ms cubic-bezier(.2,.7,.2,1),background 150ms ease}
.hero .big::after{content:"";position:absolute;inset:-17px;border-radius:999px;border:1px solid #F0C6C4}
.hero .big:hover{background:#D31F19}
.hero .big:active{transform:scale(.97)}
.hero .big i{display:block;width:46px;height:46px;border-radius:999px;background:#fff}
.hero .sub{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);text-align:center;white-space:nowrap}

.tb{flex:none;display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--rule);padding:0 4px 6px}
.tb button{background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 0 10px;cursor:pointer}
.tb .dot{width:6px;height:6px;border-radius:999px;border:1px solid var(--ink-3);background:transparent}
.tb .lb{font-size:11px;font-weight:500;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;color:var(--ink-2)}
.tb button.on .dot{background:var(--red);border-color:var(--red)}
.tb button.on .lb{color:var(--ink);font-weight:700}
.home{flex:none;display:flex;justify-content:center;padding:0 0 9px}
.home i{display:block;width:134px;height:5px;border-radius:999px;background:var(--ink)}
</style>
</head>
<body>
<div class="sheet">
<div class="row">

  <div class="col">
    <span class="cap"><b>Log run</b> &nbsp;· Bebas hero, stripped back</span>
    <div class="phone v1" data-screen-label="Voice Log · Bebas 1">
      <div class="sb"><span>10:12</span><span class="g"><span class="bars"><i></i><i></i><i></i><i></i></span><svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 11.2 .5 3.6a10.5 10.5 0 0 1 15 0L8 11.2Z" fill="#111"/></svg><span class="batt">84</span></span></div>
      <div class="mast"><img class="mark" src="assets/logo-stacked.png" alt="Post Run Drip"><span class="r"><span class="rtop"><a class="link" href="#">Today <span>&#8599;</span></a><button class="icon" aria-label="Menu"><i></i><i></i><i></i></button></span></span></div>
      <div class="body">
        <div class="lede">
          <h1 class="h">Log your run.</h1>
          <p class="dek">Tap the button to start your voice memo.</p>
        </div>
        <div class="linked">
          <div class="eyebrow"><span>Linked to</span><a href="#">Change &#8599;</a></div>
          <p class="lrun"><b>4.43</b> mi &middot; 31:52 &middot; 7:12<i>/mi</i> &middot; Aug 20</p>
        </div>
        <div class="hero">
          <button class="big" aria-label="Record"><i></i></button>
          <span class="sub">Tap to record</span>
        </div>
      </div>
      <div class="tb">
        <button class="on"><span class="dot"></span><span class="lb">Log</span></button>
        <button><span class="dot"></span><span class="lb">Train</span></button>
        <button><span class="dot"></span><span class="lb">Trends</span></button>
        <button><span class="dot"></span><span class="lb">Week</span></button>
        <button><span class="dot"></span><span class="lb">Ask</span></button>
        <button><span class="dot"></span><span class="lb">Sheet</span></button>
      </div>
      <div class="home"><i></i></div>
    </div>
  </div>

</div>
</div>
</body>
</html>
