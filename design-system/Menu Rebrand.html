<!doctype html>
<!-- @dsCard group="Screens" name="Menu Rebrand" subtitle="Editorial typographic index — slide-over nav" viewport="1400x900" -->
<html>
<head>
  <meta charset="utf-8">
  <title>Post Run Drip · Menu · Brand Rebrand</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="ui_kits/ios_app/tokens.css">
  <style>
    html, body { margin: 0; padding: 0; min-height: 100vh; background: #1A1815; }
    #root { width: 100%; min-height: 100vh; }
    .ref-board {
      width: 100%; height: 100%;
      background: #000;
      display: flex; align-items: center; justify-content: center;
    }
    .ref-board img { max-width: 100%; max-height: 100%; display: block; }
    .ref-tag {
      position: absolute; top: 12px; left: 12px;
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 10px; letter-spacing: 0.14em;
      background: rgba(212, 89, 42, 0.95); color: #fff;
      padding: 4px 8px; border-radius: 2px;
      text-transform: uppercase; z-index: 2;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- kit -->
  <script type="text/babel" src="ui_kits/ios_app/ios-frame.jsx"></script>
  <script type="text/babel" src="ui_kits/ios_app/Primitives.jsx"></script>
  <script type="text/babel" src="ui_kits/ios_app/design-canvas.jsx"></script>

  <!-- screen -->
  <script type="text/babel" src="menu-rebrand.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    /* Phone frame — menu opens below the status bar, over the dimmed app. */
    function MenuFrame({ children }) {
      return (
        <IOSDevice width={390} height={844}>
          <div style={{
            paddingTop: 62,
            height: "100%", boxSizing: "border-box",
            background: "var(--paper)", overflow: "hidden",
          }}>
            <div style={{ height: "100%", position: "relative" }}>{children}</div>
          </div>
        </IOSDevice>
      );
    }

    function CurrentScreenshot({ src, label }) {
      return (
        <div style={{ position: "relative", width: "100%", height: "100%" }}>
          <span className="ref-tag">{label}</span>
          <div className="ref-board">
            <img src={src} alt="Current menu screen" />
          </div>
        </div>
      );
    }

    function Canvas() {
      return (
        <DesignCanvas
          title="App Menu · Brand Rebrand"
          subtitle="The slide-over nav, rebuilt as an editorial index. Pastel circle-icons and card-in-card rows are gone; a numbered table of contents, an athlete masthead, and hairline dividers take their place. Coral is held to one hit per cluster."
        >
          <DCSection
            id="reference"
            title="Reference — current production"
            subtitle="White card-in-card rows, Apple-Health pastel coral circles, every row competing for the same accent."
          >
            <DCArtboard id="current" label="Current · slide-over menu" width={390} height={844}>
              <CurrentScreenshot src="scraps/menu-before.png" label="Current" />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="rebrand"
            title="Rebrand — editorial index"
            subtitle="Hover a row to see the live state. Numbered 01–07 like a contents page; grouped Targets / Review / Library & Account for clearer wayfinding."
          >
            <DCArtboard id="menu" label="Menu — typographic index" width={390} height={844}>
              <MenuFrame><AppMenu /></MenuFrame>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    function mount() {
      if (typeof window.AppMenu !== "function") {
        return setTimeout(mount, 50);
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<Canvas />);
    }
    mount();
  </script>
</body>
</html>
