<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Train · plan journey — Post Run Drip exploration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F5F3F0;
    --paper-deep: #E8E4DF;
    --card: #FFFFFF;
    --card-elev: #FAFAF8;
    --ink: #1A1815;
    --ink-2: #6B6560;
    --ink-3: #9B9590;
    --coral: #D4592A;
    --coral-deep: #B84420;
    --coral-wash: rgba(212, 89, 42, 0.12);
    --rule: #E8E4E0;
    --font-display: "Crimson Pro", Georgia, serif;
    --font-body: "PT Serif", Georgia, serif;
    --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    --shadow-card: 0 2px 8px rgba(0,0,0,0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper-deep);
    font-family: var(--font-body);
    color: var(--ink);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 20px 80px;
  }

  /* ---- exploration chrome (outside the phone) ---- */
  .expo-strip {
    width: 100%; max-width: 860px;
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: var(--font-mono); font-size: 10px;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2);
    border-bottom: 1px solid rgba(26,24,21,0.2);
    padding-bottom: 10px; margin-bottom: 28px;
  }
  .expo-strip b { color: var(--ink); font-weight: 600; }
  .expo-switch {
    display: flex; gap: 0; margin-bottom: 28px;
    border: 1px solid rgba(26,24,21,0.25);
  }
  .expo-switch button {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    font-family: var(--font-mono); font-size: 10px; font-weight: 500;
    letter-spacing: 0.13em; text-transform: uppercase;
    color: var(--ink-2); padding: 10px 18px;
    border-right: 1px solid rgba(26,24,21,0.25);
  }
  .expo-switch button:last-child { border-right: 0; }
  .expo-switch button.on { background: var(--ink); color: var(--paper); }
  .expo-caption {
    font-family: var(--font-body); font-style: italic; font-size: 13px;
    color: var(--ink-2); max-width: 480px; text-align: center;
    line-height: 1.55; margin-bottom: 32px;
  }

  /* ---- phone frame ---- */
  .phone {
    width: 393px; background: var(--paper);
    border-radius: 44px; overflow: hidden;
    box-shadow: 0 12px 48px rgba(0,0,0,0.22), 0 0 0 10px #17150F;
    display: flex; flex-direction: column;
    height: 852px; position: relative;
  }
  .statusbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 28px 6px;
    font-family: var(--font-mono); font-size: 12px; font-weight: 600;
    color: var(--ink);
  }
  .platestrip {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 8px 24px 10px;
    font-family: var(--font-mono); font-size: 8.5px;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3);
  }
  .platestrip b { color: var(--ink-2); font-weight: 600; }

  .screen {
    flex: 1; overflow-y: auto; padding: 0 24px;
    scrollbar-width: none;
  }
  .screen::-webkit-scrollbar { display: none; }

  /* ---- shared editorial primitives ---- */
  .eyebrow {
    font-family: var(--font-mono); font-size: 10px; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2);
  }
  .eyebrow.coral { color: var(--coral); }
  .edrule {
    display: flex; align-items: center; gap: 10px; margin: 26px 0;
  }
  .edrule::before, .edrule::after {
    content: ""; flex: 1; height: 1px; background: var(--rule);
  }
  .edrule i {
    width: 3px; height: 3px; border-radius: 999px;
    background: var(--ink-3); font-size: 0;
  }
  .link {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.10em;
    text-transform: uppercase; color: var(--ink-2); cursor: pointer;
    border-bottom: 1px solid var(--rule); padding-bottom: 2px;
  }
  .link.coral { color: var(--coral); border-color: rgba(212,89,42,0.4); }

  /* ---- hero ---- */
  .hero { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end;
          padding: 14px 0 16px; border-bottom: 1px solid var(--rule); }
  .hero h1 { font-family: var(--font-display); font-weight: 700; font-size: 28px;
             letter-spacing: -0.01em; color: var(--ink); }
  .hero-meta { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.10em;
               text-transform: uppercase; color: var(--ink-3); margin-top: 6px; }
  .hero-rhs { text-align: right; cursor: pointer; }
  .hero-goal { font-family: var(--font-mono); font-weight: 600; font-size: 21px;
               color: var(--coral); font-variant-numeric: tabular-nums; }
  .hero-goal-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.12em;
                     text-transform: uppercase; color: var(--ink-3); margin-top: 2px; }

  /* ---- pace ladder ---- */
  .ladder { display: grid; grid-template-columns: repeat(4, 1fr);
            padding: 13px 0 11px; border-bottom: 1px solid var(--rule); }
  .ladder-cell { display: flex; flex-direction: column; align-items: center; gap: 3px;
                 border-right: 1px solid var(--rule); }
  .ladder-cell:last-child { border-right: 0; }
  .ladder-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.12em;
                  text-transform: uppercase; color: var(--ink-2); }
  .ladder-pace { font-family: var(--font-mono); font-weight: 600; font-size: 16px;
                 color: var(--ink); font-variant-numeric: tabular-nums; }
  .ladder-pace.range { font-size: 12.5px; padding-top: 3px; }
  .ladder-unit { font-family: var(--font-mono); font-size: 8px; color: var(--ink-3);
                 letter-spacing: 0.08em; }
  .ladder-src { font-family: var(--font-mono); font-size: 8.5px; letter-spacing: 0.11em;
                text-transform: uppercase; color: var(--ink-3); text-align: center;
                padding: 8px 0 0; }
  .ladder-src b { color: var(--ink-2); font-weight: 500; }

  /* ---- segmenter ---- */
  .seg { display: grid; grid-template-columns: 1fr 1fr 1fr; margin-top: 4px;
         border-bottom: 1px solid var(--rule); }
  .seg button {
    appearance: none; background: transparent; border: 0; cursor: pointer;
    padding: 13px 0; position: relative;
    font-family: var(--font-mono); font-size: 10.5px; font-weight: 500;
    letter-spacing: 0.13em; text-transform: uppercase; color: var(--ink-2);
  }
  .seg button.on { color: var(--ink); font-weight: 600; }
  .seg button.on::after {
    content: ""; position: absolute; left: 28%; right: 28%; bottom: -1px;
    height: 1.5px; background: var(--coral);
  }

  /* ---- week nav + day rows ---- */
  .weeknav { text-align: center; padding: 16px 0 6px; }
  .weeknav-label { font-family: var(--font-mono); font-size: 11px; font-weight: 600;
                   letter-spacing: 0.13em; text-transform: uppercase; color: var(--ink); }
  .weeknav-sub { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.10em;
                 text-transform: uppercase; color: var(--ink-3); margin-top: 4px; }

  .day { display: grid; grid-template-columns: 46px 1fr 74px; gap: 12px;
         padding: 13px 0; border-bottom: 1px solid var(--rule);
         align-items: baseline; cursor: pointer; }
  .day-dow { font-family: var(--font-mono); font-size: 10.5px; font-weight: 600;
             letter-spacing: 0.10em; text-transform: uppercase; color: var(--ink-2); }
  .day-date { font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-3);
              letter-spacing: 0.08em; margin-top: 4px; text-transform: uppercase; }
  .day-zone { font-family: var(--font-mono); font-size: 9px; font-weight: 500;
              letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); }
  .day-name { font-family: var(--font-display); font-size: 17px; font-weight: 700;
              letter-spacing: -0.01em; color: var(--ink); margin-top: 3px; }
  .day-desc { font-family: var(--font-body); font-style: italic; font-size: 12px;
              color: var(--ink-3); line-height: 1.45; margin-top: 3px; }
  .day-rhs { text-align: right; }
  .day-dist { font-family: var(--font-mono); font-size: 16px; font-weight: 600;
              color: var(--ink); font-variant-numeric: tabular-nums; }
  .day-sub { font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-3);
             letter-spacing: 0.08em; margin-top: 4px; text-transform: uppercase; }

  .day.today { background: rgba(212,89,42,0.045); margin: 0 -12px; padding-left: 12px; padding-right: 12px; }
  .day.today .day-dow { color: var(--coral); }
  .day.done .day-name { color: var(--ink-2); font-weight: 600; }
  .day.done .day-dist { color: var(--ink-2); }
  .day.rest .day-name { color: var(--ink-2); font-style: italic; font-weight: 400;
                        font-family: var(--font-body); font-size: 14px; }
  .day.open .day-name { color: var(--ink-3); font-style: italic; font-weight: 400;
                        font-family: var(--font-body); font-size: 14px; }

  .rowfoot { display: flex; justify-content: space-between; padding: 16px 0 4px; }

  /* ---- empty state (plan section, no-plan journey) ---- */
  .empty-nudge { font-family: var(--font-body); font-style: italic; font-size: 14.5px;
                 color: var(--ink-2); line-height: 1.6; margin-top: 10px; }

  .start { padding: 15px 0; border-bottom: 1px solid var(--rule); cursor: pointer;
           display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: baseline; }
  .start-title { font-family: var(--font-display); font-size: 18px; font-weight: 700;
                 letter-spacing: -0.01em; color: var(--ink); }
  .start-desc { font-family: var(--font-body); font-style: italic; font-size: 12.5px;
                color: var(--ink-3); line-height: 1.5; margin-top: 4px; }
  .start-arrow { font-family: var(--font-mono); font-size: 13px; color: var(--ink-3); }
  .start.lead .start-title { color: var(--coral); }
  .start.lead .start-arrow { color: var(--coral); }

  /* ---- setup / preview ---- */
  .sheet-head { padding: 16px 0 14px; border-bottom: 1px solid var(--rule); }
  .sheet-head h1 { font-family: var(--font-display); font-size: 27px; font-weight: 700;
                   letter-spacing: -0.01em; margin-top: 6px; }
  .sheet-meta { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.10em;
                text-transform: uppercase; color: var(--ink-3); margin-top: 6px; }

  .spec { display: grid; grid-template-columns: 1fr auto; padding: 12px 0;
          border-bottom: 1px solid var(--rule); align-items: baseline; }
  .spec-label { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.12em;
                text-transform: uppercase; color: var(--ink-2); }
  .spec-val { font-family: var(--font-mono); font-size: 13px; font-weight: 600;
              color: var(--ink); font-variant-numeric: tabular-nums; }

  .arc { padding: 18px 0 6px; border-bottom: 1px solid var(--rule); }
  .arc-bars { display: flex; align-items: flex-end; gap: 3px; height: 64px; margin-top: 12px; }
  .arc-bar { flex: 1; background: var(--ink-3); opacity: 0.5; border-radius: 1px; }
  .arc-bar.phase-b { opacity: 0.75; }
  .arc-bar.peak { background: var(--coral); opacity: 1; }
  .arc-bar.taper { opacity: 0.35; }
  .arc-labels { display: flex; justify-content: space-between; margin-top: 8px;
                font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.10em;
                text-transform: uppercase; color: var(--ink-3); }

  .phase-row { display: grid; grid-template-columns: 62px 1fr 62px; gap: 12px;
               padding: 12px 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
  .phase-wk { font-family: var(--font-mono); font-size: 9px; font-weight: 600;
              letter-spacing: 0.10em; text-transform: uppercase; color: var(--ink-2); }
  .phase-name { font-family: var(--font-display); font-size: 16px; font-weight: 700; color: var(--ink); }
  .phase-desc { font-family: var(--font-body); font-style: italic; font-size: 12px;
                color: var(--ink-3); margin-top: 3px; line-height: 1.45; }
  .phase-mi { font-family: var(--font-mono); font-size: 12px; font-weight: 600;
              color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }

  .fineprint { font-family: var(--font-body); font-style: italic; font-size: 12.5px;
               color: var(--ink-2); line-height: 1.6; padding: 16px 0 6px; }

  .btn { display: block; width: 100%; margin: 18px 0 10px;
         background: var(--coral); color: #fff; border: 0; cursor: pointer;
         border-radius: 10px; padding: 15px 0;
         font-family: var(--font-display); font-size: 17px; font-weight: 600; }
  .btn:active { background: var(--coral-deep); transform: scale(0.98); }
  .btn-sub { text-align: center; padding-bottom: 8px; }

  /* ---- calendar mode ---- */
  .cal-head { text-align: center; padding: 16px 0 10px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-dow { font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.10em;
             text-transform: uppercase; color: var(--ink-3); text-align: center;
             padding: 6px 0; }
  .cal-cell { background: var(--card); border-radius: 6px; min-height: 58px;
              padding: 5px 4px; box-shadow: var(--shadow-card); cursor: pointer;
              display: flex; flex-direction: column; gap: 3px; }
  .cal-cell.out { background: transparent; box-shadow: none; }
  .cal-num { font-family: var(--font-mono); font-size: 9px; color: var(--ink-3);
             font-variant-numeric: tabular-nums; }
  .cal-cell.today .cal-num { color: var(--coral); font-weight: 700; }
  .cal-cell.today { outline: 1.5px solid var(--coral); outline-offset: -1.5px; }
  .cal-tag { font-family: var(--font-mono); font-size: 7.5px; font-weight: 600;
             letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink);
             line-height: 1.3; }
  .cal-sub { font-family: var(--font-mono); font-size: 7px; color: var(--ink-3);
             font-variant-numeric: tabular-nums; }
  .cal-cell.done .cal-tag { color: var(--ink-2); }
  .cal-cell.planned .cal-tag { color: var(--ink); }
  .cal-cell.planned { border-left: 2px solid rgba(212,89,42,0.55); }
  .cal-cell.selfplan { border: 1px dashed var(--ink-3); box-shadow: none; background: var(--card-elev); }
  .cal-cell.addable .cal-add { font-family: var(--font-mono); font-size: 10px;
             color: var(--ink-3); margin: auto; }
  .cal-key { display: flex; gap: 16px; justify-content: center; padding: 14px 0 4px;
             font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.10em;
             text-transform: uppercase; color: var(--ink-3); }
  .cal-key i { display: inline-block; width: 8px; height: 8px; margin-right: 5px;
               vertical-align: -1px; font-size: 0; }
  .cal-key .k1 i { background: var(--card); border-left: 2px solid rgba(212,89,42,0.55); box-shadow: var(--shadow-card); }
  .cal-key .k2 i { border: 1px dashed var(--ink-3); background: var(--card-elev); }
  .cal-key .k3 i { background: var(--card); box-shadow: var(--shadow-card); }

  /* ---- tab bar ---- */
  .tabbar { border-top: 1px solid var(--rule); background: var(--paper);
            display: grid; grid-template-columns: repeat(4, 1fr);
            padding: 12px 0 26px; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 7px;
         font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.13em;
         text-transform: uppercase; color: var(--ink-2); cursor: pointer; }
  .tab i { width: 6px; height: 6px; border-radius: 999px;
           border: 1.5px solid var(--ink-3); font-size: 0; }
  .tab.on { color: var(--coral); }
  .tab.on i { background: var(--coral); border-color: var(--coral); }

  .footnote { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.12em;
              text-transform: uppercase; color: var(--ink-3); text-align: center;
              padding: 26px 0 10px; }
  .hist-nudge { font-family: var(--font-body); font-style: italic; font-size: 14px;
                color: var(--ink-2); line-height: 1.6; text-align: center;
                padding: 40px 20px; }
</style>
</head>
<body>

  <div class="expo-strip">
    <span><b>POST RUN DRIP</b>&nbsp;&nbsp;—&nbsp;&nbsp;TRAIN · PLAN JOURNEY</span>
    <span>EXPLORATION · JUL 2026</span>
  </div>

  <div class="expo-switch" id="journeySwitch">
    <button data-j="none" class="on">1 · No plan</button>
    <button data-j="setup">2 · Adding a plan</button>
    <button data-j="active">3 · Plan active</button>
  </div>

  <p class="expo-caption" id="expoCaption"></p>

  <div class="phone">
    <div class="statusbar"><span>9:41</span><span>···</span></div>
    <div class="platestrip"><span><b>RUNNING LOG</b> — TRAIN</span><span id="figLabel">FIG. 21 · JUL 2</span></div>
    <div class="screen" id="screen"></div>
    <div class="tabbar">
      <div class="tab"><i></i>LOG</div>
      <div class="tab"><i></i>TRENDS</div>
      <div class="tab on"><i></i>TRAIN</div>
      <div class="tab"><i></i>COACH</div>
    </div>
  </div>

<script>
/* ------------------------------------------------------------------ */
/* Data — Maya. 3:28 marathon anchor (Houston, Jan 2026), 3:16 goal.  */
/* Zones derive from the race anchor, not the goal.                    */
/* ------------------------------------------------------------------ */

const CAPTIONS = {
  none:   "activePlan == nil is a first-class state. The week still reads from HealthKit; zones still derive from the race anchor; the plan section states the absence, then offers three starting points.",
  setup:  "Template preview before anything lands on the calendar. The mileage arc, the phases, the paces keyed to her anchor — then one action. Nothing auto-applies.",
  active: "Plan as a subset of Train. CURRENT is the week; CALENDAR layers planned work over the training that actually happened. Workout labels are pace-zone labels.",
};

const LADDER = `
  <div class="ladder">
    <div class="ladder-cell"><span class="ladder-label">Easy</span><span class="ladder-pace range">9:52–10:54</span><span class="ladder-unit">/ MI</span></div>
    <div class="ladder-cell"><span class="ladder-label">MP</span><span class="ladder-pace">7:56</span><span class="ladder-unit">/ MI</span></div>
    <div class="ladder-cell"><span class="ladder-label">LT</span><span class="ladder-pace">7:25</span><span class="ladder-unit">/ MI</span></div>
    <div class="ladder-cell"><span class="ladder-label">5K</span><span class="ladder-pace">6:56</span><span class="ladder-unit">/ MI</span></div>
  </div>
  <div class="ladder-src">ZONES FROM RACE ANCHOR&nbsp;&nbsp;·&nbsp;&nbsp;<b>3:28 · HOUSTON · JAN 2026</b>&nbsp;&nbsp;·&nbsp;&nbsp;ALL 10 ↗</div>`;

const SEG = (mode) => `
  <div class="seg">
    <button data-m="current"  class="${mode==='current'  ? 'on':''}">Current</button>
    <button data-m="calendar" class="${mode==='calendar' ? 'on':''}">Calendar</button>
    <button data-m="history"  class="${mode==='history'  ? 'on':''}">History</button>
  </div>`;

const dayRow = (d) => `
  <div class="day ${d.state}">
    <div><div class="day-dow">${d.dow}</div><div class="day-date">${d.date}</div></div>
    <div>
      ${d.zone ? `<div class="day-zone">${d.zone}</div>` : ``}
      <div class="day-name">${d.name}</div>
      ${d.desc ? `<div class="day-desc">${d.desc}</div>` : ``}
    </div>
    <div class="day-rhs">
      ${d.dist ? `<div class="day-dist">${d.dist}</div>` : ``}
      ${d.sub  ? `<div class="day-sub">${d.sub}</div>`   : ``}
    </div>
  </div>`;

/* ---------------- Journey 1 — no plan ---------------- */

const WEEK_NOPLAN = [
  { dow:"MON", date:"JUN 29", zone:"EASY", name:"Easy 6",        desc:"“Legs heavy first mile, loosened up by three.”", dist:"6.1 mi", sub:"10:12 AVG", state:"done" },
  { dow:"TUE", date:"JUN 30", zone:"",     name:"Rest",           desc:"", dist:"", sub:"", state:"rest" },
  { dow:"WED", date:"JUL 1",  zone:"MP",   name:"MP 5 mi",        desc:"“Held 7:58s without straining. Warm out.”", dist:"7.3 mi", sub:"W/ WU · CD", state:"done" },
  { dow:"THU", date:"JUL 2",  zone:"EASY", name:"Easy 5",         desc:"Logged this morning · voice memo processing.", dist:"5.0 mi", sub:"TODAY", state:"today" },
  { dow:"FRI", date:"JUL 3",  zone:"",     name:"Nothing planned — tap to add", desc:"", dist:"", sub:"", state:"open" },
  { dow:"SAT", date:"JUL 4",  zone:"",     name:"Nothing planned — tap to add", desc:"", dist:"", sub:"", state:"open" },
  { dow:"SUN", date:"JUL 5",  zone:"LONG", name:"Long 12",        desc:"Self-planned · Tuesday night.", dist:"12 mi", sub:"PLANNED", state:"" },
];

const viewNoPlan = (mode) => {
  if (mode === "calendar") return calView(false);
  if (mode === "history")  return histView();
  return `
    <div class="hero">
      <div>
        <h1>Your training.</h1>
        <div class="hero-meta">LAST 7 DAYS&nbsp;&nbsp;·&nbsp;&nbsp;24.6 MI&nbsp;&nbsp;·&nbsp;&nbsp;4 RUNS&nbsp;&nbsp;·&nbsp;&nbsp;ACWR 1.08</div>
      </div>
      <div class="hero-rhs">
        <div class="hero-goal">3:16:00</div>
        <div class="hero-goal-label">GOAL · MARATHON ↗</div>
      </div>
    </div>
    ${LADDER}
    ${SEG("current")}
    <div class="weeknav">
      <div class="weeknav-label">THIS WEEK&nbsp;&nbsp;·&nbsp;&nbsp;JUN 29 – JUL 5</div>

};

/* ---------------- Journey 2 — setup / preview ---------------- */

const ARC = [34,37,40,36,42,44,40,46,48,44,46,42,38,32,26,20];

const viewSetup = () => `
  <div class="sheet-head">
    <div class="eyebrow">TEMPLATE&nbsp;&nbsp;·&nbsp;&nbsp;MARATHON · 16 WEEKS</div>
    <h1>Marathon block.</h1>
    <div class="sheet-meta">BUILT AROUND YOUR 40 MPW BASELINE&nbsp;&nbsp;·&nbsp;&nbsp;PACES FROM YOUR 3:28 ANCHOR</div>

  <div class="spec"><span class="spec-label">Race</span><span class="spec-val">CHICAGO&nbsp;·&nbsp;OCT 11</span></div>
  <div class="spec"><span class="spec-label">Starts</span><span class="spec-val">MON&nbsp;·&nbsp;JUN 22</span></div>
  <div class="spec"><span class="spec-label">Peak week</span><span class="spec-val">48 MI&nbsp;·&nbsp;WK 09</span></div>
  <div class="spec"><span class="spec-label">Quality days</span><span class="spec-val">2 / WK&nbsp;+&nbsp;LONG</span></div>

  <div class="phase-row">

  <p class="fineprint">Workouts land in your calendar as planned days — move, edit,

  <button class="btn" data-go="active">Add to calendar</button>
  <div class="btn-sub"><span class="link" data-go="none">Back to templates ↗</span></div>

/* ---------------- Journey 3 — active plan ---------------- */

const WEEK_ACTIVE = [
  { dow:"MON", date:"JUN 29", zone:"EASY", name:"Easy 6",   desc:"Aerobic, conversational.", dist:"6.1 mi", sub:"DONE · 10:12", state:"done" },
  { dow:"TUE", date:"JUN 30", zone:"",     name:"Rest",     desc:"", dist:"", sub:"", state:"rest" },

const viewActive = (mode) => {

/* ---------------- Calendar mode (shared) ---------------- */
/* July 2026 — Jul 1 falls on Wednesday. Grid runs Jun 29 – Aug 2.  */

const calView = (hasPlan) => {
  const cells = [];
  const tag = (n, cls, t, s) =>
    `<div class="cal-cell ${cls}"><span class="cal-num">${n}</span>${t?`<span class="cal-tag">${t}</span>`:''}${s?`<span class="cal-sub">${s}</span>`:''}</div>`;
  const add = (n) =>
    `<div class="cal-cell addable"><span class="cal-num">${n}</span><span class="cal-add">+</span></div>`;
  const blank = (n) => `<div class="cal-cell"><span class="cal-num">${n}</span></div>`;

  // Week Jun 29 – Jul 5
  cells.push(tag("29","done","E 6","6.1"));
  cells.push(tag("30","done","REST",""));
  cells.push(tag("1","done","MP 5","8.0"));
  cells.push(tag("2","today", hasPlan ? "LT 4" : "E 5", hasPlan ? "7.0" : "5.0"));
  cells.push(hasPlan ? tag("3","planned","E 5","5.0") : add("3"));
  cells.push(hasPlan ? tag("4","planned","REST","")  : add("4"));
  cells.push(hasPlan ? tag("5","planned","LONG WO","14") : tag("5","selfplan","LONG 12","12"));
  // Jul 6 – 12
  const w2 = hasPlan
    ? [["6","planned","E 6","6"],["7","planned","REST",""],["8","planned","MP 6","9"],["9","planned","E 5","5"],["10","planned","REST",""],["11","planned","E 4","4"],["12","planned","LONG 14","14"]]
    : [["6"],["7"],["8"],["9"],["10"],["11"],["12"]];
  w2.forEach(c => cells.push(c.length>1 ? tag(...c) : add(c[0])));
  // Jul 13 – 19
  const w3 = hasPlan
    ? [["13","planned","E 6","6"],["14","planned","5K 5×1K","8"],["15","planned","E 5","5"],["16","planned","REST",""],["17","planned","E 5","5"],["18","planned","REST",""],["19","planned","LONG 15","15"]]
    : [["13"],["14"],["15"],["16"],["17"],["18"],["19"]];
  w3.forEach(c => cells.push(c.length>1 ? tag(...c) : add(c[0])));
  // Jul 20 – 26 (mostly bare either way, one self-planned race tune-up)
  cells.push(hasPlan ? tag("20","planned","E 6","6") : add("20"));
  cells.push(hasPlan ? tag("21","planned","REST","") : add("21"));
  cells.push(hasPlan ? tag("22","planned","HMP 5","8") : add("22"));
  cells.push(hasPlan ? tag("23","planned","E 5","5") : add("23"));
  cells.push(hasPlan ? tag("24","planned","REST","") : add("24"));
  cells.push(tag("25","selfplan","RACE 10K",""));
  cells.push(hasPlan ? tag("26","planned","LONG 15","15") : add("26"));

  return `
    ${SEG("calendar")}
    <div class="cal-head">
      <div class="weeknav-label">JULY 2026</div>
      <div class="weeknav-sub">${hasPlan ? "158 MI PLANNED · BASE → SPECIFIC" : "21.1 MI SO FAR · 2 SELF-PLANNED"}</div>
    </div>
    <div class="cal-grid">
      ${["M","T","W","T","F","S","S"].map(d=>`<div class="cal-dow">${d}</div>`).join("")}
      ${cells.join("")}
    </div>
    <div class="cal-key">
      ${hasPlan ? `<span class="k1"><i></i>PLAN</span>` : ``}
      <span class="k2"><i></i>SELF-PLANNED</span>
      <span class="k3"><i></i>COMPLETED</span>
    </div>
    <p class="empty-nudge" style="font-size:12.5px; text-align:center;">
      ${hasPlan
        ? "Tap any day to see the full workout — or to move it."
        : "Tap a future day to plan a workout. Past days fill themselves from HealthKit."}
    </p>
    <div class="footnote">— RESTRAINT AS FOUNDATION, INTENSITY AS ACCENT</div>`;
};

const histView = () => `
  ${SEG("history")}
  <p class="hist-nudge">Pace × volume distribution, cycle overlays, and fitness arcs
    live here — out of scope for this exploration. See TrainingScreen HISTORY.</p>`;

/* ---------------- state + render ---------------- */

let journey = "none";
let mode = "current";

const FIGS = { none: "FIG. 21 · JUL 2", setup: "FIG. 22 · JUL 2", active: "FIG. 23 · JUL 2" };

function render() {
  const screen = document.getElementById("screen");
  document.getElementById("expoCaption").textContent = CAPTIONS[journey];
  document.getElementById("figLabel").textContent = FIGS[journey];
  if (journey === "none")  screen.innerHTML = viewNoPlan(mode);
  if (journey === "setup") screen.innerHTML = viewSetup();
  if (journey === "active")screen.innerHTML = viewActive(mode);
  screen.scrollTop = 0;

  screen.querySelectorAll(".seg button").forEach(b =>
    b.addEventListener("click", () => { mode = b.dataset.m; render(); }));
  screen.querySelectorAll("[data-go]").forEach(el =>
    el.addEventListener("click", () => {
      journey = el.dataset.go; mode = "current";
      document.querySelectorAll("#journeySwitch button").forEach(x =>
        x.classList.toggle("on", x.dataset.j === journey));
      render();
    }));
}

document.querySelectorAll("#journeySwitch button").forEach(b =>
  b.addEventListener("click", () => {
    journey = b.dataset.j; mode = "current";
    document.querySelectorAll("#journeySwitch button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    render();
  }));

render();
</script>
