<!doctype html>
<!-- @dsCard group="Screens" name="Voice Log · 032c" subtitle="Voice-log screen — Helvetica Black display, Times accent, single red" viewport="470x960" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Post Run Drip · Voice Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFFFFF;--ink:#111111;--ink-2:#6B6B6B;--ink-3:#9A9A9A;--rule:#EBEBEB;--red:#EE2B24;--sans:"Helvetica Neue",Helvetica,"Archivo",system-ui,sans-serif;--serif:"Times New Roman",Times,serif}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#C6C6C6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.stage{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:28px 20px}
.phone{width:393px;height:852px;flex:none;background:var(--paper);color:var(--ink);font-family:var(--sans);border-radius:46px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 26px 70px rgba(0,0,0,.3),0 0 0 11px #0C0C0C,0 0 0 12px #2C2C2C}
a{color:var(--ink)}a:hover{color:var(--red)}
button{font-family:var(--sans)}
.caps{font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}

/* status bar */
.sb{height:54px;flex:none;padding:0 30px 0 34px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:700}
.sb .g{display:flex;align-items:center;gap:6px}
.sb .bars{display:flex;align-items:flex-end;gap:2px;height:11px}
.sb .bars i{width:3px;background:var(--ink);border-radius:1px;display:block}
.sb .bars i:nth-child(1){height:4px}.sb .bars i:nth-child(2){height:6px}.sb .bars i:nth-child(3){height:9px}.sb .bars i:nth-child(4){height:11px}
.sb .batt{display:flex;align-items:center;justify-content:center;min-width:29px;height:16px;background:var(--ink);color:#fff;border-radius:4px;font-size:10px;font-weight:700;padding:0 4px}

/* header — unchanged */
.hd{flex:none;height:56px;padding:0 22px;display:flex;align-items:center;justify-content:space-between}
.icon{width:44px;height:44px;margin-left:-11px;background:transparent;border:0;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:0 10px;cursor:pointer}
.icon i{display:block;height:2px;border-radius:2px;background:var(--ink)}
.link{height:44px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;text-decoration:none}

/* plate — name only */
.plate{flex:none;padding:2px 22px 12px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}

/* tabs */
.tabs{flex:none;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.tab{height:52px;background:transparent;border:0;border-bottom:2px solid transparent;font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;color:var(--ink-2);cursor:pointer}
.tab.on{color:var(--ink);border-bottom-color:var(--red)}

/* headline */
.head{flex:none;padding:34px 22px 30px;text-align:center;border-bottom:1px solid var(--rule)}
.h1{font-size:40px;font-weight:900;letter-spacing:-.04em;line-height:1;text-transform:uppercase;white-space:nowrap;margin:0}
.dek{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.35;color:var(--ink-2);margin:14px auto 0;white-space:nowrap}

/* linked to */
.linked{flex:none;padding:15px 22px 17px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:7px}
.linked .r{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.linked .lab{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;color:var(--ink-2)}
.linked .act{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink-3);padding-bottom:2px}
.linked .act:hover{color:var(--red);border-bottom-color:var(--red)}
.linked .note{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--ink-2)}

/* record */
.action{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0 22px}
.rec{width:104px;height:104px;flex:none;border-radius:999px;background:var(--red);border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform 150ms cubic-bezier(.2,.7,.2,1),background 150ms ease}
.rec:hover{background:#D31F19}
.rec:active{transform:scale(.97)}
.rec i{display:block;width:34px;height:34px;border-radius:999px;background:#fff}
.action .lbl{font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;color:var(--ink)}

/* tab bar */
.tb{flex:none;display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--rule);padding:0 4px 6px}
.tb button{background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 0 10px;cursor:pointer}
.tb .dot{width:6px;height:6px;border-radius:999px;border:1px solid var(--ink-3);background:transparent}
.tb .lb{font-size:11px;font-weight:500;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;color:var(--ink-2)}
.tb button.on .dot{background:var(--red);border-color:var(--red)}
.tb button.on .lb{color:var(--ink);font-weight:700}
.home{flex:none;display:flex;justify-content:center;padding:0 0 9px}
.home i{display:block;width:134px;height:5px;border-radius:999px;background:var(--ink)}
</style>
</head>
<body>
<div class="stage">
<div class="phone" data-screen-label="Voice Log">

  <div class="sb">
    <span>10:12</span>
    <span class="g">
      <span class="bars"><i></i><i></i><i></i><i></i></span>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 11.2 .5 3.6a10.5 10.5 0 0 1 15 0L8 11.2Z" fill="#111"/></svg>
      <span class="batt">84</span>
    </span>
  </div>

  <div class="hd">
    <button class="icon" aria-label="Menu"><i></i><i></i><i></i></button>
    <a class="link" href="#">Today <span>&#8599;</span></a>
  </div>

  <div class="plate">Running Log</div>

  <div class="tabs">
    <button class="tab on">Log run</button>
    <button class="tab">Check in</button>
  </div>

  <div class="head">
    <h1 class="h1">Log your run.</h1>
    <p class="dek">Tap the button to start your voice memo.</p>
  </div>

  <div class="linked">
    <div class="r">
      <span class="lab">Linked to</span>
      <a class="act" href="#">Link a run &#8599;</a>
    </div>
    <span class="note">Optional — attach to a recent run.</span>
  </div>

  <div class="action">
    <button class="rec" aria-label="Tap to record"><i></i></button>
    <span class="lbl">Tap to record</span>
  </div>

  <div class="tb">
    <button class="on"><span class="dot"></span><span class="lb">Log</span></button>
    <button><span class="dot"></span><span class="lb">Train</span></button>
    <button><span class="dot"></span><span class="lb">Trends</span></button>
    <button><span class="dot"></span><span class="lb">Week</span></button>
    <button><span class="dot"></span><span class="lb">Ask</span></button>
    <button><span class="dot"></span><span class="lb">Sheet</span></button>
  </div>

  <div class="home"><i></i></div>

</div>
</div>
</body>
</html>
