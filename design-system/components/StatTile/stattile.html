<!doctype html>
<!-- @dsCard group="Components" name="Stat Tile" subtitle="Tabular numerals under tracked labels" viewport="700x230" -->
<html lang="en"><head><meta charset="utf-8"><title>Stat Tile</title>
<link rel="stylesheet" href="../../styles.css">
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
.card{padding:28px 32px}
.lbl{font-family:var(--font-mono);font-size:9px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.note{font-family:var(--font-body);font-style:italic;font-size:11px;color:var(--ink-3);line-height:1.45;margin:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0}.grid>div{padding-right:16px;border-right:1px solid var(--rule)}.grid>div:last-child{border-right:0}.stack{display:flex;flex-direction:column;gap:20px}
</style></head>
<body><div class="card"><div id="root"></div></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script>
var NS = window.PostRunDripDesignSystem_019e23;
var h = React.createElement;
var view = h("div", { className: "stack" },
  h("div", { className: "grid" },
    h("div", null, h(NS.StatTile, { label: "Avg work", value: "5:13", unit: "/mi", coral: true })),
    h("div", null, h(NS.StatTile, { label: "Work", value: "5.0", unit: "mi" })),
    h("div", null, h(NS.StatTile, { label: "Avg HR", value: "169", unit: "bpm" })),
    h("div", null, h(NS.StatTile, { label: "Spread", value: "10", unit: "s", delta: "-4s vs last", deltaTone: "pos" }))
  ),
  h("p", { className: "note" }, "Lay out 1- or 2-up on mobile; never 3-up at phone width — it squeezes the numerals.")
);
ReactDOM.createRoot(document.getElementById("root")).render(view);
</script>
</body></html>
