<!doctype html>
<!-- @dsCard group="Components" name="Log Entry" subtitle="One run in the feed — mood dot, chip, headline, words, stats" viewport="700x760" -->
<html lang="en"><head><meta charset="utf-8"><title>Log Entry</title>
<link rel="stylesheet" href="../../styles.css">
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
.card{padding:28px 32px}
.col{width:393px;padding:0 22px;border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
.note{font-family:var(--font-serif);font-style:italic;font-size:13px;color:var(--ink-2);line-height:1.45;margin:18px 0 0;max-width:62ch}
</style></head>
<body><div class="card"><div id="root"></div></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script>
var NS = window.PostRunDripDesignSystem_019e23;
var h = React.createElement;
ReactDOM.createRoot(document.getElementById("root")).render(
  h("div", null,
    h("div", { className: "col" },
      h(NS.LogEntry, {
        date: "Friday 21 Aug", mood: "positive", type: "Intervals", keyed: true,
        title: "6 \u00d7 800m.",
        prose: "Legs turned over better than Tuesday. The last two reps were the fastest, which almost never happens.",
        stats: [{ label: "Dist", value: "7.47", unit: "mi" }, { label: "Time", value: "53:51" }, { label: "Pace", value: "7:13", unit: "/mi" }],
        byline: "Voice 0:42 \u00b7 transcribed 8:40"
      }),
      h(NS.LogEntry, {
        date: "Thursday 20 Aug", mood: "tired", type: "Easy",
        title: "Easy 4.4 miles.",
        voice: "\u2014 still not right, ankle stiff for the first mile, knee finally fine \u2014",
        stats: [{ label: "Dist", value: "4.43", unit: "mi" }, { label: "Time", value: "31:52" }, { label: "Pace", value: "7:12", unit: "/mi" }]
      }),
      h(NS.LogEntry, {
        date: "Tuesday 18 Aug", mood: "injured", type: "Cut short",
        title: "Cut short at 3 miles.",
        voice: "\u2014 calf tightened on the bridge, walked home, iced it \u2014",
        stats: [{ label: "Dist", value: "3.02", unit: "mi" }, { label: "Time", value: "23:40" }, { label: "Pace", value: "7:50", unit: "/mi" }],
        style: { borderBottom: 0 }
      })
    ),
    h("p", { className: "note" }, "Prose or voice, never both: the written note supersedes the raw transcript once the athlete edits it.")
  )
);
</script>
</body></html>
