<!doctype html>
<!-- @dsCard group="Screens" name="Analytical Charts" subtitle="Per-run pace/HR/elevation — 3 directions" viewport="1500x920" -->
<html>
<head>
  <meta charset="utf-8">
  <title>Post Run Drip · Analytical Charts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="ui_kits/ios_app/tokens.css">
  <style>
    html, body { margin: 0; padding: 0; min-height: 100vh; background: #1A1815; }
    #root { width: 100%; min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- kit -->
  <script type="text/babel" src="ui_kits/ios_app/ios-frame.jsx"></script>
  <script type="text/babel" src="ui_kits/ios_app/Primitives.jsx"></script>
  <script type="text/babel" src="ui_kits/ios_app/design-canvas.jsx"></script>

  <!-- charts -->
  <script type="text/babel" src="charts-data.jsx"></script>
  <script type="text/babel" src="charts-analytics.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    function ChartFrame({ children }) {
      return (
        <IOSDevice width={390} height={844}>
          <div style={{ paddingTop: 50, paddingBottom: 0, height: "100%", boxSizing: "border-box", background: "var(--paper)" }}>
            {children}
          </div>
        </IOSDevice>
      );
    }

    function Canvas() {
      return (
        <DesignCanvas
          title="Workout Analysis · Charts"
          subtitle="Three analytical treatments of one run's pace, heart rate & elevation. Each shares the editorial chrome; what differs is how the telemetry reads. Drag across any chart to scrub — readouts sync."
        >
          <DCSection
            id="charts"
            title="Per-run telemetry — three directions"
            subtitle="A · Combined overlay (terrain + pace & HR lines, HR-zone ribbon). B · Stacked small-multiples sharing one x-axis. C · Splits analysis with HR-zone distribution."
          >
            <DCArtboard id="combined" label="A · Combined overlay" width={390} height={844}>
              <ChartFrame><RunScreen sectionTitle="Pace · HR · Elevation" sectionRight="6.9 MI" chart={<CombinedChart />} /></ChartFrame>
            </DCArtboard>
            <DCArtboard id="stack" label="B · Stacked small-multiples" width={390} height={844}>
              <ChartFrame><RunScreen sectionTitle="Telemetry · stacked" sectionRight="6.9 MI" chart={<StackCharts />} /></ChartFrame>
            </DCArtboard>
            <DCArtboard id="splits" label="C · Splits analysis" width={390} height={844}>
              <ChartFrame><RunScreen sectionTitle="Splits · by HR zone" sectionRight="PER MILE" chart={<SplitsChart />} /></ChartFrame>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    function mount() {
      if (typeof window.CombinedChart !== "function" || typeof window.RunScreen !== "function") {
        return setTimeout(mount, 50);
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<Canvas />);
    }
    mount();
  </script>
</body>
</html>
