<!doctype html>
<!-- @dsCard group="Screens" name="Fitness Predictor Rebrand" -->
<html>
<head>
  <meta charset="utf-8">
  <title>Post Run Drip · Fitness Predictor · Brand Rebrand</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="ui_kits/ios_app/tokens.css">
  <style>
    html, body { margin: 0; padding: 0; min-height: 100vh; background: #1A1815; }
    #root { width: 100%; min-height: 100vh; }
    /* Reference (current) artboard chrome — just a screenshot */
    .ref-board {
      width: 100%; height: 100%;
      background: #000;
      display: flex; align-items: center; justify-content: center;
    }
    .ref-board img {
      max-width: 100%; max-height: 100%;
      display: block;
    }
    .ref-tag {
      position: absolute; top: 12px; left: 12px;
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 10px; letter-spacing: 0.14em;
      background: rgba(212, 89, 42, 0.95); color: #fff;
      padding: 4px 8px; border-radius: 2px;
      text-transform: uppercase; z-index: 2;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- kit -->
  <script type="text/babel" src="ui_kits/ios_app/ios-frame.jsx"></script>
  <script type="text/babel" src="ui_kits/ios_app/Primitives.jsx"></script>
  <script type="text/babel" src="ui_kits/ios_app/design-canvas.jsx"></script>

  <!-- screen -->
  <script type="text/babel" src="fitness-predictor-rebrand.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    /* PredictorFrame — iOS device + tab bar wrapping the screen */
    function PredictorFrame({ offline, empty }) {
      return (
        <IOSDevice width={390} height={844}>
          <div style={{
            paddingTop: 62, paddingBottom: 34,
            height: "100%", boxSizing: "border-box",
            display: "flex", flexDirection: "column",
            background: "var(--paper)",
          }}>
            <div style={{ flex: 1, overflow: "hidden" }}>
              <FitnessPredictorRebrand offline={offline} empty={empty} />
            </div>
            <TabBar active="trends" onChange={() => {}} />
          </div>
        </IOSDevice>
      );
    }

    /* Reference — the current production screenshot */
    function CurrentScreenshot() {
      return (
        <div style={{ position: "relative", width: "100%", height: "100%" }}>
          <span className="ref-tag">Current · Production</span>
          <div className="ref-board">
            <img src="scraps/predictor-before.png" alt="Current Fitness Predictor screen" />
          </div>
        </div>
      );
    }

    function Canvas() {
      return (
        <DesignCanvas
          title="Fitness Predictor · Brand Rebrand"
          subtitle="Same screen, brought in line with PRD: plate strip, mono numerals, hairlines instead of card-on-card, one coral per cluster, quiet error treatment."
        >
          <DCSection
            id="compare"
            title="Before & after"
            subtitle="The current production view (screenshot) next to a brand-aligned redesign of the same screen."
          >
            <DCArtboard id="cmp-before" label="A · Current production"
                        width={414} height={874}>
              <CurrentScreenshot />
            </DCArtboard>
            <DCArtboard id="cmp-after" label="B · Brand-aligned redesign"
                        width={414} height={874}>
              <PredictorFrame />
            </DCArtboard>
          </DCSection>

          <DCSection
            id="states"
            title="State variants"
            subtitle="Edge cases the production view also has to handle — same brand language, scaled appropriately."
          >
            <DCArtboard id="st-offline" label="C · Network · Offline (replaces coral banner)"
                        width={414} height={874}>
              <PredictorFrame offline />
            </DCArtboard>
            <DCArtboard id="st-empty" label="D · Volume · no data this period"
                        width={414} height={874}>
              <PredictorFrame empty />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<Canvas />);
  </script>
</body>
</html>
