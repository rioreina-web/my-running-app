<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Post Run Drip</title>
<link rel="stylesheet" href="styles.css">
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0}
.tile{width:1280px;height:854px;display:flex;overflow:hidden}
.mark{flex:1;background:var(--ink);display:flex;align-items:center;justify-content:center;padding:72px 88px}
.mark img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
.strip{width:300px;display:flex;flex-direction:column}
.strip i{flex:1;display:block}
</style></head>
<body>
<div class="tile">
  <div class="mark"><img src="assets/PRD-White.png" alt="post run drip"></div>
  <div class="strip">
    <i style="background:#EE2B24"></i>
    <i style="background:#D31F19"></i>
    <i style="background:#8F5D06"></i>
    <i style="background:#1F7A41"></i>
  </div>
</div>
</body></html>
