# Dependency update PRs. Added 2026-09-03: the ML service was pinned to a
# PyJWT with seven published advisories and the web app to a Next.js with
# three middleware-bypass advisories, and nothing was watching. Grouped so a
# week of bumps is one PR per ecosystem, not twenty.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-deps:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /ml-service
    schedule:
      interval: weekly
    groups:
      ml-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
