name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The ios job's `if:` offers workflow_dispatch as a manual override; without
  # this trigger declared, that branch of the condition could never fire.
  workflow_dispatch:

# Cancel superseded runs on the same ref to keep CI cost predictable.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which areas did this change touch? A workflow-level `paths:` filter would
  # gate every job in the file, so the detection lives here and individual jobs
  # consume it. Cheap: one ubuntu runner doing a git diff.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Check for iOS changes
        run: |
          # Anything not a pull_request (push to main, manual dispatch) builds
          # everything — there is no base ref to diff against.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ci.yml counts as an iOS change: edits to the build job should be
          # validated by actually running it.
          if git diff --name-only \
               "${{ github.event.pull_request.base.sha }}" \
               "${{ github.event.pull_request.head.sha }}" \
             | grep -qE '^(RunningLog/|\.github/workflows/ci\.yml$)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  edge-functions:
    name: Edge functions (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno check (typecheck all)
        run: |
          set -e
          # Typecheck every function entry + shared modules.
          for f in $(find . -name "index.ts" -not -path "*/node_modules/*"); do
            echo "::group::deno check $f"
            deno check "$f"
            echo "::endgroup::"
          done
          for f in $(find _shared -name "*.ts" -not -name "*.test.ts"); do
            echo "::group::deno check $f"
            deno check "$f"
            echo "::endgroup::"
          done
      - name: deno test
        run: deno test --allow-all

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22: `node --test` glob patterns need 21+, and the test:smoke
          # script's --experimental-strip-types needs 22.6+. Node 20 fails both.
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm test

  ml-service:
    name: ML service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - run: pip install -r requirements.txt
      # httpx powers FastAPI's TestClient. pytest-asyncio reserved for future
      # tests that exercise async paths beyond what TestClient covers.
      - run: pip install pytest httpx
      - name: pytest (smoke tests for /health + JWT middleware)
        run: pytest tests/ -v

  ios:
    name: iOS (Xcode)
    runs-on: macos-15
    needs: changes
    # iOS runners are ~10× more expensive than ubuntu, so this job is gated —
    # but the gate is now the diff, not a label. It used to be the `ios` label
    # alone, which no automation applied and which did not exist in the repo:
    # every Swift-only PR silently skipped its build and reported green without
    # having compiled. The label survives as a manual override for forcing a
    # build on a PR that does not touch RunningLog/.
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.ios == 'true' ||
      contains(toJSON(github.event.pull_request.labels.*.name), 'ios')
    defaults:
      run:
        working-directory: RunningLog
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      # Secrets.xcconfig is the project's `baseConfigurationReference` for all
      # four build configurations, but it is gitignored (it holds real keys),
      # so a fresh CI checkout could never configure the project — every run
      # died at "Unable to open base configuration reference file" before
      # compiling a single Swift file. The placeholder values in the tracked
      # .example are fine here: this job compiles the app, it does not run it.
      - name: Stub Secrets.xcconfig
        run: cp Secrets.xcconfig.example Secrets.xcconfig
      # The RunningLog project ships a single app target with no test bundle,
      # so `xcodebuild test` fails with "no test bundles available to test".
      # Validate that the app compiles instead. Switch back to `test` if/when
      # a unit-test target is added.
      #
      # Destination is generic rather than a named device: pinning a simulator
      # name couples CI to whichever devices the runner's SDK happens to ship,
      # and a build-only job doesn't need a concrete one.
      - name: Build
        run: |
          xcodebuild build \
            -project RunningLog.xcodeproj \
            -scheme RunningLog \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log
        shell: bash

  db-lint:
    name: DB lint (Supabase)
    runs-on: ubuntu-latest
    # Job-level env so the step `if` below can gate on the secret being present.
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Lint the linked remote database directly. Booting a local stack and
      # applying the full migration set doesn't work in CI (some migrations only
      # ever run against real Supabase), so we lint the deployed schema instead.
      # `db lint` is read-only. Requires the SUPABASE_DB_URL repo secret: the
      # project's Postgres connection string (percent-encoded password). Until
      # that secret is added, this step is skipped (the job passes as a no-op).
      - name: supabase db lint (remote)
        if: ${{ env.SUPABASE_DB_URL != '' }}
        run: supabase db lint --db-url "$SUPABASE_DB_URL" --schema public --fail-on error

  eval-gate:
    name: Eval coverage gate (prompts)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need base ref for the diff
      - name: Check prompt changes have cassette coverage
        run: python3 .github/scripts/check_eval_coverage.py "origin/${{ github.base_ref }}"
